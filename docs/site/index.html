<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Documentação técnica e de produto do Dev Dashboard">
  <title>Dev Dashboard Docs</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171c26;--border:#262d3a;--text:#ecf1f8;--muted:#98a3b3;--accent:#79a7ff;--accent2:#9d7cff;--success:#68d391;--code:#0b0e14;--shadow:0 18px 50px rgba(0,0,0,.28);--sidebar:310px;--toc:250px}
    :root[data-theme="light"]{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--panel2:#f0f3f8;--border:#dce2eb;--text:#19212d;--muted:#647184;--accent:#295fd5;--accent2:#7047c7;--success:#237a4b;--code:#f4f6fa;--shadow:0 18px 50px rgba(35,45,65,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}a{color:var(--accent)}
    .shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:color-mix(in srgb,var(--panel) 94%,transparent);border-right:1px solid var(--border);padding:22px 16px;overflow:auto;z-index:20;backdrop-filter:blur(16px)}
    .brand{display:flex;gap:12px;align-items:center;padding:2px 8px 20px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 10px 26px rgba(76,111,220,.3)}.brand strong{display:block;font-size:15px}.brand span{display:block;color:var(--muted);font-size:12px}
    .search{position:relative;margin-bottom:20px}.search input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:10px 36px 10px 12px;outline:none}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.shortcut{position:absolute;right:10px;top:9px;color:var(--muted);font-size:12px;border:1px solid var(--border);border-radius:5px;padding:0 5px}.search-results{position:absolute;left:0;right:0;top:46px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:50}.search-results[hidden]{display:none}.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;padding:12px;cursor:pointer}.result:last-child{border-bottom:0}.result:hover{background:var(--panel2)}.result strong{display:block}.result small{color:var(--muted)}
    .nav-group{margin:0 0 18px}.nav-title{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:750;padding:6px 8px;cursor:pointer}.nav-items{display:grid;gap:2px}.nav-link{display:block;border-radius:8px;padding:7px 9px;color:var(--muted);text-decoration:none;font-size:13px}.nav-link:hover{background:var(--panel2);color:var(--text)}.nav-link.active{background:color-mix(in srgb,var(--accent) 14%,var(--panel2));color:var(--text);box-shadow:inset 2px 0 var(--accent)}
    .main{grid-column:2;min-width:0}.topbar{position:sticky;top:0;height:64px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.breadcrumbs{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px}.icon-button{border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:7px 10px;cursor:pointer}.icon-button:hover{background:var(--panel2)}.mobile-menu{display:none}
    .page{display:grid;grid-template-columns:minmax(0,860px) var(--toc);gap:56px;justify-content:center;padding:56px 42px 110px}.article{min-width:0}.article-header{padding-bottom:26px;margin-bottom:32px;border-bottom:1px solid var(--border)}.article-header .eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:750}.article-header h1{font-size:42px;line-height:1.08;margin:10px 0 14px;letter-spacing:-.035em}.article-header p{color:var(--muted);font-size:17px;margin:0;max-width:720px}.doc-meta{margin-top:14px;color:var(--muted);font-size:12px}
    .markdown{font-size:16px}.markdown h1{display:none}.markdown h2,.markdown h3,.markdown h4{scroll-margin-top:86px;line-height:1.25;letter-spacing:-.018em}.markdown h2{font-size:28px;margin:52px 0 18px;padding-top:8px}.markdown h3{font-size:21px;margin:34px 0 12px}.markdown h4{font-size:17px;margin:24px 0 8px}.markdown p{margin:0 0 18px}.markdown ul,.markdown ol{padding-left:24px;margin:0 0 20px}.markdown li{margin:5px 0}.markdown blockquote{margin:24px 0;padding:14px 18px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;color:var(--muted)}.markdown hr{border:0;border-top:1px solid var(--border);margin:38px 0}.markdown code{font-family:"SFMono-Regular",Consolas,monospace;font-size:.88em;background:var(--code);border:1px solid var(--border);padding:2px 5px;border-radius:5px}.code-block{position:relative;margin:24px 0}.code-block pre{overflow:auto;background:var(--code);border:1px solid var(--border);border-radius:12px;padding:18px;margin:0}.code-block pre code{border:0;padding:0;background:none;font-size:13px}.copy-code{position:absolute;right:8px;top:8px;border:1px solid var(--border);background:var(--panel2);border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer}.markdown table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14px;display:block;overflow:auto}.markdown th,.markdown td{border:1px solid var(--border);padding:9px 12px;text-align:left;white-space:nowrap}.markdown th{background:var(--panel2)}.markdown a{text-decoration-thickness:1px;text-underline-offset:3px}.markdown img{max-width:100%;border-radius:10px}.callout{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:16px 18px;margin:22px 0}
    .toc{position:sticky;top:94px;align-self:start;max-height:calc(100vh - 120px);overflow:auto}.toc-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}.toc a{display:block;color:var(--muted);text-decoration:none;font-size:12px;padding:4px 0 4px calc((var(--level) - 2)*12px);border-left:1px solid var(--border);padding-left:calc(10px + (var(--level) - 2)*10px)}.toc a:hover{color:var(--text)}
    .loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}.error{border:1px solid #8c3a48;background:#351820;color:#ffd9df;border-radius:12px;padding:18px}.footer-note{margin-top:70px;padding-top:22px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
    @media(max-width:1180px){.page{grid-template-columns:minmax(0,820px);}.toc{display:none}}
    @media(max-width:800px){.shell{display:block}.sidebar{transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}body.menu-open .sidebar{transform:translateX(0)}.main{grid-column:auto}.mobile-menu{display:block}.topbar{padding:0 16px}.page{padding:34px 20px 80px}.article-header h1{font-size:34px}.search-results{position:fixed;left:12px;right:12px;top:78px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="logo">DD</div><div><strong>Dev Dashboard</strong><span>Documentação profissional</span></div></div>
      <div class="search"><input id="search" type="search" placeholder="Buscar na documentação" autocomplete="off" aria-label="Buscar na documentação"><span class="shortcut">/</span><div class="search-results" id="search-results" hidden></div></div>
      <nav id="navigation" aria-label="Documentação"></nav>
    </aside>
    <main class="main">
      <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-button mobile-menu" id="menu-button" aria-label="Abrir menu">☰</button><div class="breadcrumbs" id="breadcrumbs">Carregando documentação…</div></div><div class="actions"><button class="icon-button" id="theme-button" aria-label="Alternar tema">◐</button></div></header>
      <div class="page"><article class="article" id="article"><div class="loading">Carregando documentação…</div></article><aside class="toc" id="toc" aria-label="Nesta página"></aside></div>
    </main>
  </div>
  <script>
    const state={catalog:null,currentPath:null,searchTimer:null};
    const el={article:document.querySelector('#article'),toc:document.querySelector('#toc'),nav:document.querySelector('#navigation'),breadcrumbs:document.querySelector('#breadcrumbs'),search:document.querySelector('#search'),results:document.querySelector('#search-results')};
    const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const slug=(value)=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-');
    function inline(text){
      const tokens=[];const hold=(html)=>`@@TOKEN${tokens.push(html)-1}@@`;
      text=text.replace(/`([^`]+)`/g,(_,code)=>hold(`<code>${escapeHtml(code)}</code>`));
      text=text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,target)=>{
        const safeLabel=escapeHtml(label);const clean=target.trim();
        if(clean.endsWith('.md')||clean.includes('.md#'))return hold(`<a href="#" data-doc-link="${escapeHtml(clean)}">${safeLabel}</a>`);
        if(/^https?:\/\//i.test(clean))return hold(`<a href="${escapeHtml(clean)}" target="_blank" rel="noreferrer">${safeLabel}</a>`);
        if(clean.startsWith('#'))return hold(`<a href="${escapeHtml(clean)}">${safeLabel}</a>`);
        return safeLabel;
      });
      text=escapeHtml(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
      return text.replace(/@@TOKEN(\d+)@@/g,(_,index)=>tokens[Number(index)]);
    }
    function renderMarkdown(markdown){
      const lines=markdown.replace(/\r\n/g,'\n').split('\n');let html='';const headings=[];let i=0;
      const isSpecial=(line,next='')=>/^#{1,4}\s/.test(line)||/^```/.test(line)||/^>/.test(line)||/^\s*[-*+]\s+/.test(line)||/^\s*\d+\.\s+/.test(line)||/^\s*---+\s*$/.test(line)||(line.includes('|')&&/^\s*\|?\s*:?-+/.test(next));
      while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue;}
        if(/^```/.test(line)){const language=line.slice(3).trim();const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;html+=`<div class="code-block"><button class="copy-code">Copiar</button><pre data-language="${escapeHtml(language)}"><code>${escapeHtml(code.join('\n'))}</code></pre></div>`;continue;}
        const heading=line.match(/^(#{1,4})\s+(.+)$/);if(heading){const level=heading[1].length;const title=heading[2].replace(/[`*_]/g,'').trim();let id=slug(title);let suffix=2;while(headings.some(h=>h.id===id))id=`${slug(title)}-${suffix++}`;headings.push({level,title,id});html+=`<h${level} id="${id}">${inline(heading[2])}</h${level}>`;i++;continue;}
        if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){const rows=[];const split=row=>row.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());rows.push(split(line));i+=2;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())rows.push(split(lines[i++]));html+='<table><thead><tr>'+rows[0].map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+row.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue;}
        if(/^>/.test(line)){const quote=[];while(i<lines.length&&/^>/.test(lines[i]))quote.push(lines[i++].replace(/^>\s?/,''));html+=`<blockquote>${quote.map(inline).join('<br>')}</blockquote>`;continue;}
        if(/^\s*[-*+]\s+/.test(line)){const items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i]))items.push(lines[i++].replace(/^\s*[-*+]\s+/,''));html+='<ul>'+items.map(item=>`<li>${inline(item)}</li>`).join('')+'</ul>';continue;}
        if(/^\s*\d+\.\s+/.test(line)){const items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))items.push(lines[i++].replace(/^\s*\d+\.\s+/,''));html+='<ol>'+items.map(item=>`<li>${inline(item)}</li>`).join('')+'</ol>';continue;}
        if(/^\s*---+\s*$/.test(line)){html+='<hr>';i++;continue;}
        const paragraph=[line.trim()];i++;while(i<lines.length&&lines[i].trim()&&!isSpecial(lines[i],lines[i+1]||'')){paragraph.push(lines[i].trim());i++;}html+=`<p>${inline(paragraph.join(' '))}</p>`;
      }
      return{html,headings};
    }
    function resolveDocLink(target){const [file,hash='']=target.split('#');const base=state.currentPath.split('/');base.pop();for(const part of file.split('/')){if(part==='..')base.pop();else if(part&&part!=='.')base.push(part);}return{path:base.join('/'),hash:hash?`#${hash}`:''};}
    function renderNavigation(){el.nav.innerHTML=state.catalog.groups.map(group=>`<section class="nav-group"><button class="nav-title" type="button"><span>${escapeHtml(group.name)}</span><span>${group.pages.length}</span></button><div class="nav-items">${group.pages.map(page=>`<a class="nav-link" data-path="${escapeHtml(page.path)}" href="?doc=${encodeURIComponent(page.path)}">${escapeHtml(page.title)}</a>`).join('')}</div></section>`).join('');
      el.nav.querySelectorAll('[data-path]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();loadDocument(link.dataset.path,true);}));
    }
    function renderToc(headings){const visible=headings.filter(h=>h.level>=2&&h.level<=4);el.toc.innerHTML=visible.length?`<div class="toc-title">Nesta página</div>${visible.map(h=>`<a href="#${h.id}" style="--level:${h.level}">${escapeHtml(h.title)}</a>`).join('')}`:'';}
    async function loadDocument(path,push=false,hash=''){state.currentPath=path;el.article.innerHTML='<div class="loading">Carregando documento…</div>';try{const response=await fetch(`/api/docs/content?path=${encodeURIComponent(path)}`);if(!response.ok)throw new Error('Documento não encontrado');const doc=await response.json();const meta=state.catalog.pages.find(page=>page.path===path);const rendered=renderMarkdown(doc.markdown);el.article.innerHTML=`<header class="article-header"><div class="eyebrow">${escapeHtml(meta?.group||'Documentação')}</div><h1>${escapeHtml(doc.title)}</h1><p>${escapeHtml(meta?.description||'')}</p><div class="doc-meta">${escapeHtml(path)} · ${Math.max(1,Math.round((meta?.bytes||0)/1024))} KB</div></header><div class="markdown">${rendered.html}</div><div class="footer-note">Este documento faz parte do repositório e evolui junto com o código.</div>`;renderToc(rendered.headings);el.breadcrumbs.textContent=`Dev Dashboard / ${meta?.group||'Documentação'} / ${doc.title}`;document.querySelectorAll('.nav-link').forEach(link=>link.classList.toggle('active',link.dataset.path===path));
        el.article.querySelectorAll('.copy-code').forEach(button=>button.addEventListener('click',async()=>{await navigator.clipboard.writeText(button.nextElementSibling.textContent);button.textContent='Copiado';setTimeout(()=>button.textContent='Copiar',1200);}));
        el.article.querySelectorAll('[data-doc-link]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();const resolved=resolveDocLink(link.dataset.docLink);loadDocument(resolved.path,true,resolved.hash);}));
        if(push)history.pushState({path},'',`?doc=${encodeURIComponent(path)}${hash}`);window.scrollTo({top:0});if(hash)setTimeout(()=>document.querySelector(hash)?.scrollIntoView(),0);document.body.classList.remove('menu-open');
      }catch(error){el.article.innerHTML=`<div class="error"><strong>Não foi possível abrir o documento.</strong><br>${escapeHtml(error.message)}</div>`;}}
    async function search(query){if(query.trim().length<2){el.results.hidden=true;return;}const response=await fetch(`/api/search?q=${encodeURIComponent(query)}`);const payload=await response.json();el.results.innerHTML=payload.results.length?payload.results.map(result=>`<button class="result" data-path="${escapeHtml(result.path)}"><strong>${escapeHtml(result.title)}</strong><small>${escapeHtml(result.group)} · ${escapeHtml(result.snippet)}</small></button>`).join(''):'<div class="result"><small>Nenhum resultado encontrado.</small></div>';el.results.hidden=false;el.results.querySelectorAll('[data-path]').forEach(button=>button.addEventListener('click',()=>{el.results.hidden=true;el.search.value='';loadDocument(button.dataset.path,true);}));}
    async function boot(){try{const response=await fetch('/api/docs');state.catalog=await response.json();renderNavigation();const requested=new URL(location.href).searchParams.get('doc');const initial=state.catalog.pages.some(page=>page.path===requested)?requested:state.catalog.defaultDocument;await loadDocument(initial,false,location.hash);}catch(error){el.article.innerHTML=`<div class="error"><strong>Falha ao iniciar a documentação.</strong><br>${escapeHtml(error.message)}</div>`;}}
    el.search.addEventListener('input',()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>search(el.search.value),180);});document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();el.search.focus();}if(event.key==='Escape')el.results.hidden=true;});document.addEventListener('click',event=>{if(!event.target.closest('.search'))el.results.hidden=true;});document.querySelector('#menu-button').addEventListener('click',()=>document.body.classList.toggle('menu-open'));document.querySelector('#theme-button').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('docs-theme',next);});const savedTheme=localStorage.getItem('docs-theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;window.addEventListener('popstate',()=>{const requested=new URL(location.href).searchParams.get('doc');if(requested)loadDocument(requested,false,location.hash);});boot();
  </script>
</body>
</html>

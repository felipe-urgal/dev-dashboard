                  state: 'occupied',
                  conflict: true,
                  expected: [
                    {
                      projectId: 'p2',
                      projectName: 'Banco',
                      service: 'server',
                    },
                  ],
                  externalProcess: {
                    pid: 5_000,
                    name: 'postgres',
                  },
                  suggestedPort: 5_433,
                },
              ],
            });

            assert.equal(
              wrapper.findAll('.local-ports-table tbody tr').length,

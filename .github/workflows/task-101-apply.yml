name: Task 101 Apply

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/task-101-safe-port-inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Aplicar Task 101
        run: |
          python <<'PY'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + "\n", encoding="utf-8")

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              contents = target.read_text(encoding="utf-8")
              if old not in contents:
                  raise SystemExit(f"Trecho não encontrado em {path}: {old[:80]!r}")
              target.write_text(contents.replace(old, new, 1), encoding="utf-8")

          write("packages/contracts/src/port.ts", r"""
          import type {
            ManagedProcessKind,
            ManagedProcessStatus,
          } from './process.js';

          export type LocalPortInspectionStatus =
            'ready' | 'unsupported' | 'unavailable';

          export type LocalPortState = 'available' | 'occupied';

          export type LocalPortScope =
            'loopback' | 'all-interfaces';

          export interface LocalPortManagedProcess {
            id: string;
            projectId: string;
            projectName: string;
            kind: ManagedProcessKind;
            status: ManagedProcessStatus;
          }

          export interface LocalPortExternalProcess {
            pid: number;
            name: string;
          }

          export interface LocalPortExpectation {
            projectId: string;
            projectName: string;
            service: 'server';
          }

          export interface LocalPortEntry {
            port: number;
            address: string;
            scope: LocalPortScope;
            state: LocalPortState;
            conflict: boolean;
            expected: LocalPortExpectation[];
            managedProcess?: LocalPortManagedProcess;
            externalProcess?: LocalPortExternalProcess;
            suggestedPort?: number;
          }

          export interface LocalPortInspection {
            status: LocalPortInspectionStatus;
            platform: 'linux' | 'unsupported';
            inspectedAt: string;
            entries: LocalPortEntry[];
            truncated: boolean;
            warning?: string;
          }
          """)

          replace(
              "packages/contracts/src/index.ts",
              """export type {\n  ManagedProcess,\n  ManagedProcessKind,\n  ManagedProcessStatus,\n  ProcessLogSnapshot,\n} from './process.js';\n\nexport type {\n  ProjectServerHealth,""",
              """export type {\n  ManagedProcess,\n  ManagedProcessKind,\n  ManagedProcessStatus,\n  ProcessLogSnapshot,\n} from './process.js';\n\nexport type {\n  LocalPortEntry,\n  LocalPortExpectation,\n  LocalPortExternalProcess,\n  LocalPortInspection,\n  LocalPortInspectionStatus,\n  LocalPortManagedProcess,\n  LocalPortScope,\n  LocalPortState,\n} from './port.js';\n\nexport type {\n  ProjectServerHealth,""",
          )

          write("apps/api/src/services/port-inspector-service.ts", r"""
          import { execFile } from 'node:child_process';
          import { readFile } from 'node:fs/promises';

          import type {
            LocalPortEntry,
            LocalPortExpectation,
            LocalPortExternalProcess,
            LocalPortInspection,
            ManagedProcess,
          } from '@dev-dashboard/contracts';

          const COMMAND_TIMEOUT_MS = 1_500;
          const MAX_OUTPUT_BYTES = 256 * 1_024;
          const DEFAULT_MAX_ENTRIES = 100;
          const MAX_SUGGESTION_DISTANCE = 100;

          const ACTIVE_STATUSES = new Set([
            'starting',
            'running',
            'stopping',
          ]);

          interface ParsedSocket {
            address: string;
            port: number;
            scope: 'loopback' | 'all-interfaces';
            pid?: number;
            processName?: string;
          }

          interface PendingEntry {
            entry: LocalPortEntry;
            externalPid?: number;
            externalName?: string;
          }

          export interface ExpectedLocalPort
            extends LocalPortExpectation {
            port: number;
          }

          export interface InspectLocalPortsInput {
            managedProcesses?: readonly ManagedProcess[];
            expectedPorts?: readonly ExpectedLocalPort[];
            projectNames?: Readonly<Record<string, string>>;
          }

          export interface PortInspectorServiceOptions {
            platform?: NodeJS.Platform;
            now?: () => Date;
            runSs?: () => Promise<string>;
            readTextFile?: (filePath: string) => Promise<string>;
            getUid?: () => number | undefined;
            maxEntries?: number;
          }

          function runSsCommand(): Promise<string> {
            return new Promise((resolve, reject) => {
              execFile(
                'ss',
                ['-H', '-ltnp'],
                {
                  encoding: 'utf8',
                  maxBuffer: MAX_OUTPUT_BYTES,
                  timeout: COMMAND_TIMEOUT_MS,
                  windowsHide: true,
                },
                (error, stdout) => {
                  if (error) {
                    reject(error);
                    return;
                  }

                  resolve(
                    typeof stdout === 'string'
                      ? stdout
                      : stdout.toString('utf8'),
                  );
                },
              );
            });
          }

          function sanitizeProcessName(value: string): string {
            const sanitized = value
              .replace(/[\u0000-\u001f\u007f]/g, '')
              .trim()
              .slice(0, 64);

            return sanitized || 'processo';
          }

          function normalizeAddress(
            value: string,
          ): Pick<ParsedSocket, 'address' | 'scope'> | null {
            const address = value
              .replace(/^\[/, '')
              .replace(/\]$/, '')
              .split('%', 1)[0]
              ?.toLowerCase();

            if (!address) return null;

            if (address === '*' || address === '0.0.0.0') {
              return {
                address: '0.0.0.0',
                scope: 'all-interfaces',
              };
            }

            if (address === '::') {
              return {
                address: '::',
                scope: 'all-interfaces',
              };
            }

            if (
              address === 'localhost' ||
              address === '::1' ||
              address === '::ffff:127.0.0.1' ||
              /^127(?:\.\d{1,3}){3}$/.test(address)
            ) {
              return {
                address: address === 'localhost'
                  ? '127.0.0.1'
                  : address,
                scope: 'loopback',
              };
            }

            return null;
          }

          function parseEndpoint(value: string): Pick<
            ParsedSocket,
            'address' | 'port' | 'scope'
          > | null {
            const separator = value.lastIndexOf(':');
            if (separator <= 0) return null;

            const port = Number(value.slice(separator + 1));
            if (
              !Number.isInteger(port) ||
              port < 1 ||
              port > 65_535
            ) {
              return null;
            }

            const normalized = normalizeAddress(
              value.slice(0, separator),
            );
            if (!normalized) return null;

            return {
              ...normalized,
              port,
            };
          }

          function parseSocketLine(line: string): ParsedSocket | null {
            const columns = line.trim().split(/\s+/);
            const endpoint = parseEndpoint(columns[3] ?? '');
            if (!endpoint) return null;

            const processMatch = line.match(
              /\("([^"]{1,64})",pid=(\d+)/,
            );
            const parsedPid = processMatch?.[2]
              ? Number(processMatch[2])
              : undefined;

            return {
              ...endpoint,
              ...(Number.isInteger(parsedPid) && parsedPid! > 0
                ? { pid: parsedPid }
                : {}),
              ...(processMatch?.[1]
                ? { processName: sanitizeProcessName(processMatch[1]) }
                : {}),
            };
          }

          function parseSockets(contents: string): ParsedSocket[] {
            const seen = new Set<string>();
            const sockets: ParsedSocket[] = [];

            for (const line of contents.split(/\r?\n/)) {
              const socket = parseSocketLine(line);
              if (!socket) continue;

              const key = [
                socket.address,
                socket.port,
                socket.pid ?? '',
              ].join(':');
              if (seen.has(key)) continue;
              seen.add(key);
              sockets.push(socket);
            }

            return sockets;
          }

          function chooseManagedProcess(
            socket: ParsedSocket,
            managedProcesses: readonly ManagedProcess[],
          ): ManagedProcess | undefined {
            const candidates = managedProcesses.filter(
              (managed) =>
                managed.port === socket.port &&
                ACTIVE_STATUSES.has(managed.status),
            );

            if (socket.pid !== undefined) {
              return candidates.find(
                (managed) => managed.pid === socket.pid,
              );
            }

            return candidates.length === 1
              ? candidates[0]
              : undefined;
          }

          function nextSuggestedPort(
            port: number,
            occupiedPorts: ReadonlySet<number>,
          ): number | undefined {
            const finalPort = Math.min(
              65_535,
              port + MAX_SUGGESTION_DISTANCE,
            );

            for (
              let candidate = port + 1;
              candidate <= finalPort;
              candidate += 1
            ) {
              if (!occupiedPorts.has(candidate)) return candidate;
            }

            return undefined;
          }

          function groupExpectations(
            expectedPorts: readonly ExpectedLocalPort[],
          ): Map<number, LocalPortExpectation[]> {
            const grouped = new Map<number, LocalPortExpectation[]>();

            for (const expected of expectedPorts) {
              if (
                !Number.isInteger(expected.port) ||
                expected.port < 1_024 ||
                expected.port > 65_535
              ) {
                continue;
              }

              const current = grouped.get(expected.port) ?? [];
              if (
                current.some(
                  (candidate) =>
                    candidate.projectId === expected.projectId,
                )
              ) {
                continue;
              }

              current.push({
                projectId: expected.projectId,
                projectName: expected.projectName,
                service: 'server',
              });
              current.sort((left, right) =>
                left.projectName.localeCompare(right.projectName),
              );
              grouped.set(expected.port, current);
            }

            return grouped;
          }

          export class PortInspectorService {
            private readonly platform: NodeJS.Platform;
            private readonly now: () => Date;
            private readonly runSs: () => Promise<string>;
            private readonly readTextFile: (
              filePath: string,
            ) => Promise<string>;
            private readonly getUid: () => number | undefined;
            private readonly maxEntries: number;

            public constructor(
              options: PortInspectorServiceOptions = {},
            ) {
              this.platform = options.platform ?? process.platform;
              this.now = options.now ?? (() => new Date());
              this.runSs = options.runSs ?? runSsCommand;
              this.readTextFile =
                options.readTextFile ??
                ((filePath) => readFile(filePath, 'utf8'));
              this.getUid =
                options.getUid ??
                (() =>
                  typeof process.getuid === 'function'
                    ? process.getuid()
                    : undefined);
              this.maxEntries = Math.max(
                1,
                Math.min(
                  DEFAULT_MAX_ENTRIES,
                  options.maxEntries ?? DEFAULT_MAX_ENTRIES,
                ),
              );
            }

            private async externalProcess(
              pid: number,
              fallbackName = 'processo',
            ): Promise<LocalPortExternalProcess | undefined> {
              const currentUid = this.getUid();
              if (currentUid === undefined) return undefined;

              let status: string;
              try {
                status = await this.readTextFile(
                  `/proc/${pid}/status`,
                );
              } catch {
                return undefined;
              }

              const uidMatch = status.match(/^Uid:\s+(\d+)/m);
              if (
                !uidMatch?.[1] ||
                Number(uidMatch[1]) !== currentUid
              ) {
                return undefined;
              }

              let name = fallbackName;
              try {
                name = await this.readTextFile(`/proc/${pid}/comm`);
              } catch {
                // O nome limitado do `ss` só é usado depois da
                // confirmação de que o PID pertence ao usuário atual.
              }

              return {
                pid,
                name: sanitizeProcessName(name),
              };
            }

            public async inspect(
              input: InspectLocalPortsInput = {},
            ): Promise<LocalPortInspection> {
              const inspectedAt = this.now().toISOString();

              if (this.platform !== 'linux') {
                return {
                  status: 'unsupported',
                  platform: 'unsupported',
                  inspectedAt,
                  entries: [],
                  truncated: false,
                  warning:
                    'A primeira versão do inspetor de portas está disponível somente no Linux.',
                };
              }

              let output: string;
              try {
                output = await this.runSs();
              } catch {
                return {
                  status: 'unavailable',
                  platform: 'linux',
                  inspectedAt,
                  entries: [],
                  truncated: false,
                  warning:
                    'Não foi possível consultar as portas locais. Verifique se o utilitário ss está disponível.',
                };
              }

              const sockets = parseSockets(output);
              const occupiedPorts = new Set(
                sockets.map((socket) => socket.port),
              );
              const managedProcesses = input.managedProcesses ?? [];
              const projectNames = input.projectNames ?? {};
              const expectations = groupExpectations(
                input.expectedPorts ?? [],
              );
              const pending: PendingEntry[] = [];

              for (const socket of sockets) {
                const expected = expectations.get(socket.port) ?? [];
                const managed = chooseManagedProcess(
                  socket,
                  managedProcesses,
                );
                const conflict =
                  expected.length > 0 &&
                  expected.some(
                    (candidate) =>
                      managed?.projectId !== candidate.projectId,
                  );
                const suggestedPort = conflict
                  ? nextSuggestedPort(
                      socket.port,
                      occupiedPorts,
                    )
                  : undefined;

                const entry: LocalPortEntry = {
                  port: socket.port,
                  address: socket.address,
                  scope: socket.scope,
                  state: 'occupied',
                  conflict,
                  expected: [...expected],
                  ...(managed
                    ? {
                        managedProcess: {
                          id: managed.id,
                          projectId: managed.projectId,
                          projectName:
                            projectNames[managed.projectId] ??
                            managed.projectId,
                          kind: managed.kind,
                          status: managed.status,
                        },
                      }
                    : {}),
                  ...(suggestedPort !== undefined
                    ? { suggestedPort }
                    : {}),
                };

                pending.push({
                  entry,
                  ...(!managed && socket.pid !== undefined
                    ? { externalPid: socket.pid }
                    : {}),
                  ...(!managed && socket.processName
                    ? { externalName: socket.processName }
                    : {}),
                });
              }

              for (const [port, expected] of expectations) {
                if (occupiedPorts.has(port)) continue;

                pending.push({
                  entry: {
                    port,
                    address: '127.0.0.1',
                    scope: 'loopback',
                    state: 'available',
                    conflict: false,
                    expected: [...expected],
                  },
                });
              }

              pending.sort((left, right) => {
                const conflictDifference =
                  Number(right.entry.conflict) -
                  Number(left.entry.conflict);
                if (conflictDifference !== 0) {
                  return conflictDifference;
                }

                const expectedDifference =
                  Number(right.entry.expected.length > 0) -
                  Number(left.entry.expected.length > 0);
                if (expectedDifference !== 0) {
                  return expectedDifference;
                }

                const portDifference =
                  left.entry.port - right.entry.port;
                if (portDifference !== 0) return portDifference;
                return left.entry.address.localeCompare(
                  right.entry.address,
                );
              });

              const truncated = pending.length > this.maxEntries;
              const selected = pending.slice(0, this.maxEntries);
              const entries = await Promise.all(
                selected.map(async (candidate) => {
                  if (candidate.externalPid === undefined) {
                    return candidate.entry;
                  }

                  const externalProcess = await this.externalProcess(
                    candidate.externalPid,
                    candidate.externalName,
                  );

                  return externalProcess
                    ? {
                        ...candidate.entry,
                        externalProcess,
                      }
                    : candidate.entry;
                }),
              );

              return {
                status: 'ready',
                platform: 'linux',
                inspectedAt,
                entries,
                truncated,
              };
            }
          }
          """)

          replace(
              "apps/api/src/routes/processes/helpers.ts",
              """import type { ServerHealthCheckService } from '../../services/server-health-check-service.js';\n\nexport const processEnvelopeResponseSchema""",
              """import type { ServerHealthCheckService } from '../../services/server-health-check-service.js';\nimport type { PortInspectorService } from '../../services/port-inspector-service.js';\n\nexport const processEnvelopeResponseSchema""",
          )
          replace(
              "apps/api/src/routes/processes/helpers.ts",
              """  serverHealthCheckService: ServerHealthCheckService;\n  projectStore: ProjectStore;\n}""",
              """  serverHealthCheckService: ServerHealthCheckService;\n  projectStore: ProjectStore;\n  portInspectorService?: PortInspectorService;\n}""",
          )

          write("apps/api/src/routes/processes/process-list-routes.ts", r"""
          import type { FastifyInstance } from 'fastify';

          import { sweepStaleProcesses } from '@dev-dashboard/process-manager';

          import {
            commonErrorResponseSchemas,
            logRetentionSweepResponseSchema,
            managedProcessResponseSchema,
          } from '../../http/response-schemas.js';
          import {
            PortInspectorService,
            type ExpectedLocalPort,
          } from '../../services/port-inspector-service.js';
          import type { ProcessRouteOptions } from './helpers.js';

          const localPortExpectationSchema = {
            type: 'object',
            additionalProperties: false,
            required: ['projectId', 'projectName', 'service'],
            properties: {
              projectId: { type: 'string' },
              projectName: { type: 'string' },
              service: { type: 'string', enum: ['server'] },
            },
          } as const;

          const localPortEntrySchema = {
            type: 'object',
            additionalProperties: false,
            required: [
              'port',
              'address',
              'scope',
              'state',
              'conflict',
              'expected',
            ],
            properties: {
              port: {
                type: 'integer',
                minimum: 1,
                maximum: 65_535,
              },
              address: {
                type: 'string',
                minLength: 1,
                maxLength: 64,
              },
              scope: {
                type: 'string',
                enum: ['loopback', 'all-interfaces'],
              },
              state: {
                type: 'string',
                enum: ['available', 'occupied'],
              },
              conflict: { type: 'boolean' },
              expected: {
                type: 'array',
                items: localPortExpectationSchema,
              },
              managedProcess: {
                type: 'object',
                additionalProperties: false,
                required: [
                  'id',
                  'projectId',
                  'projectName',
                  'kind',
                  'status',
                ],
                properties: {
                  id: { type: 'string' },
                  projectId: { type: 'string' },
                  projectName: { type: 'string' },
                  kind: {
                    type: 'string',
                    enum: [
                      'server',
                      'webpack',
                      'worker',
                      'test',
                      'script',
                      'compose-build',
                    ],
                  },
                  status: {
                    type: 'string',
                    enum: [
                      'starting',
                      'running',
                      'stopping',
                      'stopped',
                      'failed',
                    ],
                  },
                },
              },
              externalProcess: {
                type: 'object',
                additionalProperties: false,
                required: ['pid', 'name'],
                properties: {
                  pid: { type: 'integer', minimum: 1 },
                  name: {
                    type: 'string',
                    minLength: 1,
                    maxLength: 64,
                  },
                },
              },
              suggestedPort: {
                type: 'integer',
                minimum: 1_024,
                maximum: 65_535,
              },
            },
          } as const;

          const localPortInspectionResponseSchema = {
            type: 'object',
            additionalProperties: false,
            required: ['inspection'],
            properties: {
              inspection: {
                type: 'object',
                additionalProperties: false,
                required: [
                  'status',
                  'platform',
                  'inspectedAt',
                  'entries',
                  'truncated',
                ],
                properties: {
                  status: {
                    type: 'string',
                    enum: ['ready', 'unsupported', 'unavailable'],
                  },
                  platform: {
                    type: 'string',
                    enum: ['linux', 'unsupported'],
                  },
                  inspectedAt: { type: 'string' },
                  entries: {
                    type: 'array',
                    maxItems: 100,
                    items: localPortEntrySchema,
                  },
                  truncated: { type: 'boolean' },
                  warning: {
                    type: 'string',
                    maxLength: 240,
                  },
                },
              },
            },
          } as const;

          async function expectedLocalPorts(
            options: ProcessRouteOptions,
          ): Promise<ExpectedLocalPort[]> {
            const projects = options.projectStore.listProjects();
            const candidates = await Promise.all(
              projects.map(async (project) => {
                try {
                  const settings =
                    await options.serverSettingsRepository.find(
                      project.id,
                    );
                  if (settings.port === undefined) return null;

                  return {
                    port: settings.port,
                    projectId: project.id,
                    projectName: project.name,
                    service: 'server' as const,
                  };
                } catch {
                  return null;
                }
              }),
            );

            return candidates.filter(
              (candidate): candidate is ExpectedLocalPort =>
                candidate !== null,
            );
          }

          export function registerProcessListRoutes(
            app: FastifyInstance,
            options: ProcessRouteOptions,
          ): void {
            const { processManager, projectStore } = options;
            const portInspectorService =
              options.portInspectorService ??
              new PortInspectorService();

            app.get(
              '/processes',
              {
                schema: {
                  querystring: {
                    type: 'object',
                    additionalProperties: false,
                    properties: {
                      workspaceId: { type: 'string', minLength: 1, maxLength: 200 },
                      projectId: { type: 'string', minLength: 1, maxLength: 200 },
                      kind: { type: 'string', enum: ['server', 'test'] },
                    },
                  },
                  response: {
                    200: {
                      type: 'object',
                      additionalProperties: false,
                      required: ['processes'],
                      properties: {
                        processes: {
                          type: 'array',
                          items: managedProcessResponseSchema,
                        },
                      },
                    },
                    ...commonErrorResponseSchemas,
                  },
                },
              },
              async (request) => {
                const query = request.query as {
                  workspaceId?: string;
                  projectId?: string;
                  kind?: 'server' | 'test';
                };
                const projects = projectStore.listProjects();
                const projectsById = new Map(projects.map((project) => [project.id, project]));
                const managed = await processManager.listProcesses();
                const processes = managed.filter((process) => {
                  if (process.kind !== 'server' && process.kind !== 'test') return false;
                  if (query.kind && process.kind !== query.kind) return false;
                  if (query.projectId && process.projectId !== query.projectId) return false;
                  const project = projectsById.get(process.projectId);
                  if (!project) return false;
                  if (query.workspaceId && project.workspaceId !== query.workspaceId) return false;
                  return true;
                });
                return { processes };
              },
            );

            app.get(
              '/ports',
              {
                schema: {
                  response: {
                    200: localPortInspectionResponseSchema,
                    ...commonErrorResponseSchemas,
                  },
                },
              },
              async () => {
                const projects = projectStore.listProjects();
                const knownProjectIds = new Set(
                  projects.map((project) => project.id),
                );
                const projectNames = Object.fromEntries(
                  projects.map((project) => [
                    project.id,
                    project.name,
                  ]),
                );
                const [managedProcesses, expectedPorts] =
                  await Promise.all([
                    processManager.listProcesses(),
                    expectedLocalPorts(options),
                  ]);
                const inspection = await portInspectorService.inspect({
                  managedProcesses: managedProcesses.filter(
                    (managed) =>
                      knownProjectIds.has(managed.projectId),
                  ),
                  expectedPorts,
                  projectNames,
                });

                return { inspection };
              },
            );

            app.post(
              '/processes/cleanup',
              {
                schema: {
                  response: {
                    200: logRetentionSweepResponseSchema,
                    ...commonErrorResponseSchemas,
                  },
                },
              },
              async () => {
                const removed = await sweepStaleProcesses(
                  processManager.stateDirectory,
                  {
                    removeAllTerminal: true,
                  },
                );

                return {
                  removed,
                  removedCount: removed.length,
                };
              },
            );
          }
          """)

          replace(
              "apps/api/src/app.ts",
              """import { ProjectDoctorService } from './services/project-doctor-service.js';\nimport { ProjectFileMutationService }""",
              """import { ProjectDoctorService } from './services/project-doctor-service.js';\nimport { PortInspectorService } from './services/port-inspector-service.js';\nimport { ProjectFileMutationService }""",
          )
          replace(
              "apps/api/src/app.ts",
              """  projectDoctorService?: ProjectDoctorService;\n  projectLanguageServerService?: ProjectLanguageServerService;""",
              """  projectDoctorService?: ProjectDoctorService;\n  portInspectorService?: PortInspectorService;\n  projectLanguageServerService?: ProjectLanguageServerService;""",
          )
          replace(
              "apps/api/src/app.ts",
              """  const projectDoctorService =\n    options.projectDoctorService ??\n    new ProjectDoctorService(options.now ? { now: options.now } : {});\n  const projectFileMutationService""",

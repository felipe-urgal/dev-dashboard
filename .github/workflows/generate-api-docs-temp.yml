name: Generate API docs temp

on:
  push:
    branches:
      - fix/runtime-production-sync-consistency

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs
        run: npm run docs:api

      - name: Upload generated API reference
        uses: actions/upload-artifact@v4
        with:
          name: generated-api-reference
          path: docs/architecture/api-reference.md
          if-no-files-found: error

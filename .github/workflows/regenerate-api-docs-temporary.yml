name: Regenerar referência da API (temporário)

on:
  push:
    branches:
      - feature/570-worktree-removal-http

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Preparar dependências nativas
        run: npm rebuild esbuild node-pty

      - name: Regenerar referência da API
        run: npm run docs:api

      - name: Commitar resultado e remover workflow temporário
        run: |
          rm .github/workflows/regenerate-api-docs-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/api-reference.md .github/workflows/regenerate-api-docs-temporary.yml
          git commit -m "docs: atualizar referência da API"
          npm run docs:api:check
          git push

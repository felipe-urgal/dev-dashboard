name: Temporary Git inventory

on:
  push:
    branches:
      - agent/task-100-test-failure-navigator

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ !contains(github.event.head_commit.message, '[skip-inventory]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-100-test-failure-navigator
      - name: Build focused inventory
        run: |
          {
            echo '## FILES'
            find apps/web/src apps/web/test apps/api/src apps/api/test packages/contracts/src -type f | sort | grep -Ei 'git|commit|branch|mutation|pull'
            echo
            echo '## MATCHES'
            grep -R -n -E 'Alterar último commit|publishLocalBranch|branches/publish|preparePublish|amend|force-with-lease|git push' apps/web/src apps/web/test apps/api/src apps/api/test packages/contracts/src 2>/dev/null || true
          } > .tmp-git-inventory.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-git-inventory.txt
          git commit -m "chore: gera inventário Git temporário [skip-inventory]"
          git push origin HEAD:agent/task-100-test-failure-navigator

name: Database Explorer Session Patch

on:
  push:
    branches:
      - refactor/database-explorer-session-composable
    paths:
      - scripts/patch-database-explorer-session-composable.mjs
      - .github/workflows/database-explorer-session-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/database-explorer-session-composable

      - name: Patch DatabaseView
        run: node scripts/patch-database-explorer-session-composable.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- apps/web/src/views/DatabaseView.vue; then
            echo "DatabaseView já está migrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/views/DatabaseView.vue
          git commit -m "refactor(database): usa sessão server-side no Explorer"
          git push

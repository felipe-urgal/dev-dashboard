name: Database Explorer Session Patch

on:
  push:
    branches:
      - refactor/database-explorer-session-composable
    paths:
      - scripts/patch-database-explorer-session-tests.mjs
      - .github/workflows/database-explorer-session-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/database-explorer-session-composable

      - name: Patch Database Explorer tests
        run: node scripts/patch-database-explorer-session-tests.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- apps/web/test/database-view.test.ts apps/web/test/database-view-concurrency.test.ts; then
            echo "Testes já estão migrados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/test/database-view.test.ts apps/web/test/database-view-concurrency.test.ts
          git commit -m "test(database): migra view para sessão do Explorer"
          git push

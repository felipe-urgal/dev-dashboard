name: Senior Review Database Patch

on:
  push:
    branches:
      - fix/senior-code-review-hardening
    paths:
      - scripts/patch-senior-review-database-view.mjs
      - .github/workflows/senior-review-database-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/senior-code-review-hardening

      - name: Patch DatabaseView
        run: node scripts/patch-senior-review-database-view.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- apps/web/src/views/DatabaseView.vue; then
            echo "DatabaseView já está corrigida."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/views/DatabaseView.vue
          git commit -m "fix(database): bloqueia contexto durante consultas"
          git push

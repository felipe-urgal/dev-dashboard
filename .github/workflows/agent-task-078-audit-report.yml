name: Agent task 078 audit report

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-audit-report.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate audit report
        run: npm audit --json > .agent-task-078-audit.json || true

      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-task-078-audit.json
          git commit -m "Gera relatório temporário do audit"
          git push origin HEAD:agent/task-078-js-ts-lsp

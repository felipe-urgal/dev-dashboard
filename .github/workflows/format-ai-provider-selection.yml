name: Format AI provider selection

on:
  push:
    branches:
      - agent/ai-provider-selection

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format AI provider selection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-provider-selection

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: >-
          npx prettier --write
          apps/api/src/routes/ai-providers.ts
          apps/api/src/services/ai-implementation-execution-service.ts
          apps/api/src/services/ai-provider-resolver.ts
          apps/api/test/ai-provider-resolver.test.ts
          apps/web/src/components/ProjectAiAssistantPanel.vue
          packages/core/src/project-ai-consent-repository.ts
          packages/core/src/project-ai-selection-repository.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/ai-providers.ts \
            apps/api/src/services/ai-implementation-execution-service.ts \
            apps/api/src/services/ai-provider-resolver.ts \
            apps/api/test/ai-provider-resolver.test.ts \
            apps/web/src/components/ProjectAiAssistantPanel.vue \
            packages/core/src/project-ai-consent-repository.ts \
            packages/core/src/project-ai-selection-repository.ts
          git commit -m "chore: format AI provider selection"
          git push origin HEAD:agent/ai-provider-selection

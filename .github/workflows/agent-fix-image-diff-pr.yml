name: Apply image diff PR fixes

on:
  push:
    branches:
      - agent/git-image-diff-preview

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/git-image-diff-preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply requested CSS fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('apps/web/src/components/ProjectGitDiffPage.css')
          text = page.read_text()
          old = ".git-diff-expand {\n  display: grid;\n  place-items: center;\n"
          new = ".git-diff-expand {\n"
          if old not in text:
              raise SystemExit('Expected .git-diff-expand grid rule not found')
          page.write_text(text.replace(old, new, 1))

          layout = Path('apps/web/src/git-diff-layout-fix.css')
          text = layout.read_text()
          old_comment = "  /* Só o eixo horizontal é contido. `overscroll-behavior: contain` nos dois\n     eixos travava a rolagem vertical da página inteira quando o ponteiro\n     estava sobre o diff: `overflow-x: hidden` abaixo transforma o elemento em\n     contêiner de rolagem, e um contêiner com `contain` interrompe o\n     encadeamento mesmo sem ter o que rolar no eixo vertical. */\n"
          new_comment = "  /* Contém apenas o gesto horizontal sem recortar o conteúdo do split. */\n"
          if old_comment not in text:
              raise SystemExit('Expected split overflow comment not found')
          text = text.replace(old_comment, new_comment, 1)
          old_rule = ".git-diff-split {\n  overflow-x: hidden !important;\n}\n\n"
          if old_rule not in text:
              raise SystemExit('Expected .git-diff-split overflow rule not found')
          layout.write_text(text.replace(old_rule, '', 1))
          PY

      - name: Regenerate API reference
        run: npm run docs:api

      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/ProjectGitDiffPage.css apps/web/src/git-diff-layout-fix.css docs/architecture/api-reference.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix: adjust diff layout and refresh API docs"
          git push origin HEAD:agent/git-image-diff-preview

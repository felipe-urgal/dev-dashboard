name: Format AI fallback offer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-fallback-offer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write apps/web/src/components/ProjectAiAssistantPanel.vue apps/web/test/ai-fallback.test.ts apps/web/test/project-ai-assistant-panel.test.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet -- apps/web/src/components/ProjectAiAssistantPanel.vue apps/web/test/ai-fallback.test.ts apps/web/test/project-ai-assistant-panel.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/ProjectAiAssistantPanel.vue apps/web/test/ai-fallback.test.ts apps/web/test/project-ai-assistant-panel.test.ts
          git commit -m "style: aplica prettier no fallback offer"
          git push origin HEAD:agent/ai-fallback-offer

name: Regenerate API docs temp

on:
  push:
    branches:
      - feature/vercel-git-managed-deploy

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/vercel-git-managed-deploy
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs and format
        run: |
          npm run docs:api
          npm run format

      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regen-api-docs-temp.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualiza artefatos gerados do CI"
          git push origin HEAD:feature/vercel-git-managed-deploy

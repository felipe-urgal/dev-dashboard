name: Task 101 Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/task-101-safe-port-inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Corrigir script de aplicação
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/task-101-apply.yml')
          content = path.read_text(encoding='utf-8')

          content, stdout_count = re.subn(
              r"resolve\(\s*typeof stdout === 'string'\s*\? stdout\s*:\s*stdout\.toString\('utf8'\),\s*\);",
              "resolve(stdout);",
              content,
              count=1,
          )

          pid_pattern = (
              r"const parsedPid = processMatch\?\.\[2\]\s*"
              r"\? Number\(processMatch\[2\]\)\s*"
              r": undefined;\s*"
              r"return \{\s*"
              r"\.\.\.endpoint,\s*"
              r"\.\.\.\(Number\.isInteger\(parsedPid\) && parsedPid! > 0\s*"
              r"\? \{ pid: parsedPid \}\s*"
              r": \{\}\),"
          )
          pid_replacement = """const parsedPid = processMatch?.[2]
              ? Number(processMatch[2])
              : undefined;
            const pid =
              parsedPid !== undefined &&
              Number.isInteger(parsedPid) &&
              parsedPid > 0
                ? parsedPid
                : undefined;

            return {
              ...endpoint,
              ...(pid !== undefined ? { pid } : {}),"""
          content, pid_count = re.subn(
              pid_pattern,
              pid_replacement,
              content,
              count=1,
          )

          if stdout_count != 1:
              raise SystemExit('Correção stdout não aplicada')
          if pid_count != 1:
              raise SystemExit('Correção PID não aplicada')

          path.write_text(content, encoding='utf-8')
          PY

          rm .github/workflows/task-101-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: ajusta tipagem do inspetor de portas"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Correção pré-PR

on:
  push:
    branches:
      - feature/ajustes-ux-historicos-e-push

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ajustes-ux-historicos-e-push
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aplica Prettier
        run: npm run format

      - name: Regenera documentação da API
        run: npm run docs:api

      - name: Executa testes e captura diagnóstico
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test 2>&1 | tee pre-pr-test.log
          exit ${PIPESTATUS[0]}

      - name: Registra correções e resultado
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          cat > pre-pr-autofix-result.md <<EOF
          # Correção pré-PR

          - npm run format: executado
          - npm run docs:api: executado
          - npm test: $TEST_OUTCOME
          EOF
          if [ "$TEST_OUTCOME" = success ]; then
            rm -f pre-pr-test.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: aplica correções da validação pré-PR"
            git pull --rebase origin feature/ajustes-ux-historicos-e-push
            git push origin HEAD:feature/ajustes-ux-historicos-e-push
          fi

      - name: Falha quando npm test falhar
        if: steps.tests.outcome != 'success'
        run: exit 1

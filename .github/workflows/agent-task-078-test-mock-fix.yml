name: Agent task 078 test mock fix

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-test-mock-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp

      - name: Fix Monaco provider mocks
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/test/project-embedded-editor.test.ts')
          content = path.read_text()
          content = content.replace(
              "    registerHoverProvider: vi.fn(disposable),\n    registerDefinitionProvider: vi.fn(disposable),\n    registerReferenceProvider: vi.fn(disposable),\n    registerCompletionItemProvider: vi.fn(disposable),\n    registerDocumentSymbolProvider: vi.fn(disposable),",
              "    registerHoverProvider: vi.fn(() => ({ dispose: vi.fn() })),\n    registerDefinitionProvider: vi.fn(() => ({ dispose: vi.fn() })),\n    registerReferenceProvider: vi.fn(() => ({ dispose: vi.fn() })),\n    registerCompletionItemProvider: vi.fn(() => ({ dispose: vi.fn() })),\n    registerDocumentSymbolProvider: vi.fn(() => ({ dispose: vi.fn() })),",
          )
          content = content.replace(
              "  const disposable = () => ({ dispose: vi.fn() });\n",
              "",
          )
          path.write_text(content)
          PY

      - name: Commit test mock fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/test/project-embedded-editor.test.ts
          git commit -m "Corrige mock dos providers do Monaco"
          git push origin HEAD:agent/task-078-js-ts-lsp

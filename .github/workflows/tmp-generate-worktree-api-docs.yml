name: Temporary Worktree API Docs

on:
  push:
    branches:
      - feature/570-worktree-http-create

permissions:
  contents: read

jobs:
  generate:
    name: Generate API docs section
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate API reference
        run: |
          npm run docs:api
          echo '---BEGIN-WORKTREE-API-SECTION---'
          sed -n '/^## Git Worktrees$/,/^## /p' docs/architecture/api-reference.md | sed '$d'
          echo '---END-WORKTREE-API-SECTION---'
          npm run docs:api:check

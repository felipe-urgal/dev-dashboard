name: Temporary Worktree API Docs

on:
  push:
    branches:
      - feature/570-worktree-http-create

permissions:
  contents: write

jobs:
  generate:
    name: Generate API docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Generate and commit API reference
        run: |
          npm run docs:api
          if git diff --quiet -- docs/architecture/api-reference.md; then
            npm run docs:api:check
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/api-reference.md
          git commit -m "docs: atualizar referência da API"
          git push

name: Format PR 289

on:
  push:
    branches:
      - agent/ai-execution-modes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ai-execution-modes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write apps/api/src/services/git-ai-code-review-service.ts apps/api/test/git-ai-code-review-synthesis.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/git-ai-code-review-service.ts apps/api/test/git-ai-code-review-synthesis.test.ts
          git commit -m "style: aplica prettier na síntese global"
          git push origin HEAD:agent/ai-execution-modes

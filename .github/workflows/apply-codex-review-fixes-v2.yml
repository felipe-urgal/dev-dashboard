name: Apply Codex review fixes v2

on:
  push:
    branches:
      - bugfix/deployment-verify-retry

permissions:
  contents: write

jobs:
  patch:
    name: Patch and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply review fixes
        shell: bash
        run: |
          git apply --verbose <<'PATCH'

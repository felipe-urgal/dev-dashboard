name: Temporary Database Components Refactor

on:
  push:
    branches:
      - refactor/database-explorer-components

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refactor DatabaseView
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          view_path = Path('apps/web/src/views/DatabaseView.vue')
          source = view_path.read_text()

          import_anchor = "import { formatDatabaseExplorerError } from '../api/database-explorer-errors';\n"
          component_imports = """import DatabaseExplorerSidebar from '../components/database/DatabaseExplorerSidebar.vue';
          import DatabaseQueryEditor from '../components/database/DatabaseQueryEditor.vue';
          import DatabaseResultTable from '../components/database/DatabaseResultTable.vue';
          """
          if component_imports not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor not found')
              source = source.replace(import_anchor, import_anchor + component_imports, 1)

          old_database_change = """function onExplorerDatabaseChange(event: Event): void {
            const target = event.target as HTMLSelectElement;
            void selectExplorerDatabase(target.value);
          }
          """
          new_table_select = """function selectExplorerTable(table: MachineDatabaseTable): void {
            explorerTable.value = table.name;
            explorerQuery.value = buildExplorerTableQuery(table);
            void previewExplorerTable();
          }
          """
          if old_database_change not in source:
              raise SystemExit('database change handler not found')
          source = source.replace(old_database_change, new_table_select, 1)

          old_table_search = """function onExplorerTableSearch(event: Event): void {
            setExplorerTableSearch((event.target as HTMLInputElement).value);
          }

          """
          if old_table_search not in source:
              raise SystemExit('table search handler not found')
          source = source.replace(old_table_search, '', 1)

          sidebar_pattern = re.compile(
              r'''          <aside\n            class="database-explorer-sidebar"\n            aria-label="Bancos e tabelas"\n          >.*?          </aside>''',
              re.S,
          )
          sidebar_replacement = '''          <DatabaseExplorerSidebar
            :databases="explorerDatabases"
            :tables="visibleExplorerTables"
            :selected-database="explorerDatabase"
            :selected-table="explorerTable"
            :table-search="explorerTableSearch"
            :filtered-table-count="filteredExplorerTables.length"
            :page="explorerTablePage"
            :page-count="explorerTablePageCount"
            :loading="explorerLoading"
            @select-database="selectExplorerDatabase"
            @search-table="setExplorerTableSearch"
            @select-table="selectExplorerTable"
            @previous-page="previousExplorerTablePage"
            @next-page="nextExplorerTablePage"
          />'''
          source, count = sidebar_pattern.subn(sidebar_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'sidebar replacement count: {count}')

          result_pattern = re.compile(
              r'''              <div class="database-explorer-result-heading">.*?(?=              <div class="database-explorer-query-box">)''',
              re.S,
          )
          result_replacement = '''              <DatabaseResultTable
                :table="explorerTable"
                :result="explorerResult"
                :visible-rows="visibleExplorerRows"
                :duration-ms="explorerQueryDurationMs"
                :search="explorerResultSearch"
                :sort="explorerResultSort"
                :copied-message="explorerCopiedMessage"
                @update:search="explorerResultSearch = $event"
                @toggle-sort="toggleExplorerResultSort"
                @copy="copyExplorerResults"
                @export="exportExplorerResults"
              />
'''
          source, count = result_pattern.subn(result_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'result replacement count: {count}')

          query_pattern = re.compile(
              r'''              <div class="database-explorer-query-box">.*?\n              </div>\n            </template>''',
              re.S,
          )
          query_replacement = '''              <DatabaseQueryEditor
                :query="explorerQuery"
                :loading="explorerLoading"
                :history-open="explorerHistoryOpen"
                :history-count="explorerQueryHistory.length"
                :recent-queries="recentExplorerQueries"
                @update:query="explorerQuery = $event"
                @toggle-history="explorerHistoryOpen = !explorerHistoryOpen"
                @clear-history="clearExplorerQueryHistory"
                @restore-query="restoreExplorerQuery"
                @toggle-favorite="toggleExplorerQueryFavorite"
                @remove-history="removeExplorerQueryHistory"
                @reset="resetExplorerQuery"
                @run="runExplorerQuery"
              />
            </template>'''
          source, count = query_pattern.subn(query_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'query editor replacement count: {count}')

          style_pattern = re.compile(r'\n<style scoped>\n(.*)\n</style>\s*$', re.S)
          match = style_pattern.search(source)
          if not match:
              raise SystemExit('scoped style block not found')
          Path('apps/web/src/views/DatabaseView.css').write_text(match.group(1).rstrip() + '\n')
          source = style_pattern.sub('\n<style src="./DatabaseView.css"></style>\n', source)
          view_path.write_text(source)

          docs_path = Path('docs/architecture/database-explorer.md')
          docs = docs_path.read_text()
          anchor = "`apps/web/src/composables/useDatabaseTableListView.ts` concentra a busca e paginação da lista de tabelas do sidebar, mantendo o page size atual de 40 itens e reiniciando a página ao alterar a busca.\n"
          component_docs = """
          A composição visual do workspace também começou a sair da view principal sem mover regras assíncronas para os filhos:

          - `DatabaseExplorerSidebar.vue` recebe bancos, tabelas e estado de paginação e emite seleção/busca/navegação;
          - `DatabaseResultTable.vue` renderiza resultado, busca e ações de cópia/exportação, delegando transformações ao `useDatabaseResultView`;
          - `DatabaseQueryEditor.vue` preserva editor, histórico e o atalho `Ctrl/Cmd + Enter`, emitindo apenas intenções para a view.

          Para manter exatamente a hierarquia visual após a extração, as regras antes `scoped` da `DatabaseView` foram movidas sem alteração para `DatabaseView.css`. Os seletores são específicos da feature (`database-*`) e agora alcançam o DOM interno dos componentes extraídos.
          """
          if component_docs.strip() not in docs:
              if anchor not in docs:
                  raise SystemExit('docs anchor not found')
              docs = docs.replace(anchor, anchor + component_docs, 1)
          old_next = "A próxima etapa de frontend decompõe a `DatabaseView` em componentes visuais menores, preservando os composables já extraídos e mantendo o storage versionado para o recorte específico posterior."
          new_next = "A próxima etapa de frontend continua a decomposição visual com `DatabaseServicesPanel` e `DatabaseConnectionDialog`, mantendo a orquestração na `DatabaseView`; o primitive de storage versionado permanece em recorte posterior."
          if old_next not in docs:
              raise SystemExit('next-step docs text not found')
          docs = docs.replace(old_next, new_next, 1)
          docs_path.write_text(docs)
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            apps/web/src/views/DatabaseView.vue \
            apps/web/src/views/DatabaseView.css \
            apps/web/src/components/database/DatabaseExplorerSidebar.vue \
            apps/web/src/components/database/DatabaseResultTable.vue \
            apps/web/src/components/database/DatabaseQueryEditor.vue \
            apps/web/test/database-explorer-components.test.ts \
            docs/architecture/database-explorer.md
          git diff --check
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/views/DatabaseView.vue apps/web/src/views/DatabaseView.css apps/web/src/components/database apps/web/test/database-explorer-components.test.ts docs/architecture/database-explorer.md
          git commit -m "refactor(database): compõe Explorer com componentes menores"
          git push origin HEAD:refactor/database-explorer-components

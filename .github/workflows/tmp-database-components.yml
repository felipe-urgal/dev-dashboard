name: Temporary Database Components Refactor

on:
  push:
    branches:
      - refactor/database-explorer-components

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refactor DatabaseView
        run: python .github/tmp_database_components.py
      - name: Format changed files
        run: |
          npx prettier --write apps/web/src/views/DatabaseView.vue apps/web/src/views/DatabaseView.css apps/web/src/components/database/DatabaseExplorerSidebar.vue apps/web/src/components/database/DatabaseResultTable.vue apps/web/src/components/database/DatabaseQueryEditor.vue apps/web/test/database-explorer-components.test.ts docs/architecture/database-explorer.md
          git diff --check
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/views/DatabaseView.vue apps/web/src/views/DatabaseView.css apps/web/src/components/database apps/web/test/database-explorer-components.test.ts docs/architecture/database-explorer.md
          git commit -m "refactor(database): compõe Explorer com componentes menores"
          git push origin HEAD:refactor/database-explorer-components

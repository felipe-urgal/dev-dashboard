name: Generate API Docs PR 200

on:
  push:
    branches:
      - fix/commit-and-server-environment-clean

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/commit-and-server-environment-clean
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API reference
        run: npm run docs:api

      - name: Commit generated reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/api-reference.md
          if git diff --cached --quiet; then
            echo "Referência já atualizada."
            exit 0
          fi
          git commit -m "docs: atualiza referência da API do servidor"
          git push origin HEAD:fix/commit-and-server-environment-clean

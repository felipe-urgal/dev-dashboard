name: Temporary force push implementation

on:
  push:
    branches:
      - agent/task-100-test-failure-navigator

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip-force-push-impl]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-100-test-failure-navigator
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation
        run: python3 .tmp_force_push_impl.py
      - name: Install dependencies
        run: npm ci
      - name: Regenerate API reference
        run: npm run docs:api
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adiciona reenvio seguro com force-with-lease [skip-force-push-impl]"
          git push origin HEAD:agent/task-100-test-failure-navigator

name: Temporary Database PR12 patch

on:
  push:
    branches:
      - refactor/database-result-view

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply DatabaseView extraction patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/views/DatabaseView.vue')
          text = path.read_text()

          text = text.replace('  MachineDatabaseQueryResult,\n', '', 1)

          old_import = "import { useDatabaseExplorerSession } from '../composables/useDatabaseExplorerSession';"
          new_import = """import { useDatabaseExplorerSession } from '../composables/useDatabaseExplorerSession';
          import { useDatabaseResultView } from '../composables/useDatabaseResultView';
          import { useDatabaseTableListView } from '../composables/useDatabaseTableListView';"""
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_result_state = """const explorerTables = ref<MachineDatabaseTable[]>([]);
          const explorerResult = ref<MachineDatabaseQueryResult | null>(null);
          const explorerQuery = ref('SELECT * FROM ');"""
          new_result_state = """const explorerTables = ref<MachineDatabaseTable[]>([]);
          const {
            search: explorerTableSearch,
            page: explorerTablePage,
            filtered: filteredExplorerTables,
            pageCount: explorerTablePageCount,
            visible: visibleExplorerTables,
            setSearch: setExplorerTableSearch,
            reset: resetExplorerTableList,
            previous: previousExplorerTablePage,
            next: nextExplorerTablePage,
          } = useDatabaseTableListView(explorerTables);
          const {
            result: explorerResult,
            search: explorerResultSearch,
            sort: explorerResultSort,
            copiedMessage: explorerCopiedMessage,
            durationMs: explorerQueryDurationMs,
            visibleRows: visibleExplorerRows,
            setResult: setExplorerResult,
            setDuration: setExplorerQueryDuration,
            clearCopiedMessage: clearExplorerCopiedMessage,
            resetPresentation: resetExplorerResultPresentation,
            clear: clearExplorerResult,
            toggleSort: toggleExplorerResultSort,
            copy: copyExplorerResults,
            exportResults: exportExplorerResults,
          } = useDatabaseResultView();
          const explorerQuery = ref('SELECT * FROM ');"""
          assert old_result_state in text
          text = text.replace(old_result_state, new_result_state, 1)

          old_view_state = """const explorerHistoryOpen = ref(false);
          const explorerResultSearch = ref('');
          const explorerResultSort = ref<{
            column: string;
            direction: 'asc' | 'desc';
          } | null>(null);
          const explorerCopiedMessage = ref('');
          const explorerTableSearch = ref('');
          const explorerTablePage = ref(1);
          const EXPLORER_TABLE_PAGE_SIZE = 40;
          const explorerQueryDurationMs = ref<number | null>(null);"""
          assert old_view_state in text
          text = text.replace(old_view_state, "const explorerHistoryOpen = ref(false);", 1)

          pattern = re.compile(
            r"const filteredExplorerTables = computed\(\(\) => \{.*?^\}\);\n\nfunction rememberExplorerQuery",
            re.MULTILINE | re.DOTALL,
          )
          text, count = pattern.subn('function rememberExplorerQuery', text, count=1)
          assert count == 1

          old_clear = """  explorerTables.value = [];
            explorerResult.value = null;
            explorerDatabase.value = '';
            explorerTable.value = '';
            explorerTableSearch.value = '';
            explorerTablePage.value = 1;
            explorerQueryDurationMs.value = null;
            explorerResultSearch.value = '';
            explorerResultSort.value = null;
            explorerCopiedMessage.value = '';"""
          new_clear = """  explorerTables.value = [];
            explorerDatabase.value = '';
            explorerTable.value = '';
            resetExplorerTableList();
            clearExplorerResult();"""
          assert old_clear in text
          text = text.replace(old_clear, new_clear, 1)

          text = text.replace('  explorerResult.value = null;\n', '  setExplorerResult(null);\n', 1)

          old_connect_reset = """    explorerTables.value = [];
              explorerTableSearch.value = '';
              explorerTablePage.value = 1;
              explorerQueryDurationMs.value = null;
              explorerResultSearch.value = '';
              explorerResultSort.value = null;
              explorerCopiedMessage.value = '';"""
          new_connect_reset = """    explorerTables.value = [];
              resetExplorerTableList();
              clearExplorerResult();"""
          assert old_connect_reset in text
          text = text.replace(old_connect_reset, new_connect_reset, 1)

          old_database_reset = """  explorerTable.value = '';
            explorerTableSearch.value = '';
            explorerTablePage.value = 1;
            explorerResult.value = null;
            explorerQueryDurationMs.value = null;"""
          new_database_reset = """  explorerTable.value = '';
            resetExplorerTableList();
            setExplorerResult(null);
            setExplorerQueryDuration(null);"""
          assert old_database_reset in text
          text = text.replace(old_database_reset, new_database_reset, 1)

          old_preview_reset = """  explorerResultSearch.value = '';
            explorerResultSort.value = null;
            explorerCopiedMessage.value = '';"""
          assert old_preview_reset in text
          text = text.replace(old_preview_reset, '  resetExplorerResultPresentation();', 1)

          text = text.replace(
            '    if (explorerSessionId.value === sessionId) explorerResult.value = result;',
            '    if (explorerSessionId.value === sessionId) setExplorerResult(result);',
            1,
          )
          text = text.replace(
            '      explorerQueryDurationMs.value = Math.round(performance.now() - startedAt);',
            '      setExplorerQueryDuration(Math.round(performance.now() - startedAt));',
            1,
          )

          text = text.replace('  explorerCopiedMessage.value = \'\';\n', '  clearExplorerCopiedMessage();\n', 1)
          text = text.replace('      explorerResult.value = result;\n', '      setExplorerResult(result);\n', 1)
          text = text.replace(
            '      explorerQueryDurationMs.value = Math.round(performance.now() - startedAt);',
            '      setExplorerQueryDuration(Math.round(performance.now() - startedAt));',
            1,
          )

          helper_pattern = re.compile(
            r"function toggleExplorerResultSort\(column: string\): void \{.*?^async function testExplorerConnection",
            re.MULTILINE | re.DOTALL,
          )
          text, count = helper_pattern.subn('async function testExplorerConnection', text, count=1)
          assert count == 1

          old_search = """function onExplorerTableSearch(event: Event): void {
            explorerTableSearch.value = (event.target as HTMLInputElement).value;
            explorerTablePage.value = 1;
          }

          function previousExplorerTablePage(): void {
            explorerTablePage.value = Math.max(1, explorerTablePage.value - 1);
          }

          function nextExplorerTablePage(): void {
            explorerTablePage.value = Math.min(
              explorerTablePageCount.value,
              explorerTablePage.value + 1,
            );
          }"""
          new_search = """function onExplorerTableSearch(event: Event): void {
            setExplorerTableSearch((event.target as HTMLInputElement).value);
          }"""
          assert old_search in text
          text = text.replace(old_search, new_search, 1)

          path.write_text(text)

          docs_path = Path('docs/architecture/database-explorer.md')
          docs = docs_path.read_text()
          anchor = """`apps/web/src/composables/useDatabaseQueryHistory.ts` concentra:

          - leitura e persistência da chave existente `dev-dashboard.database-query-history`;
          - deduplicação por consulta, driver e banco;
          - preservação do favorito ao repetir uma consulta;
          - favoritos, remoção e limpeza;
          - limite persistido de 50 entradas e recorte das 8 consultas recentes.

          """
          addition = anchor + """`apps/web/src/composables/useDatabaseResultView.ts` concentra o estado e as transformações da visualização de resultados:

          - resultado estruturado e duração da última leitura;
          - busca local nas células;
          - ordenação ascendente/descendente sem mutar as rows originais;
          - mensagem de cópia, serialização TSV para clipboard e exportação CSV/JSON da visualização atual;
          - resets explícitos que distinguem limpar o resultado de apenas preparar uma nova apresentação.

          `apps/web/src/composables/useDatabaseTableListView.ts` concentra a busca e paginação da lista de tabelas do sidebar, mantendo o page size atual de 40 itens e reiniciando a página ao alterar a busca.

          """
          assert anchor in docs
          docs = docs.replace(anchor, addition, 1)
          docs = docs.replace(
            "A view continua responsável apenas por adaptar essas unidades ao contexto visual: preencher o draft ao escolher uma conexão, restaurar query/tabela/banco quando possível e decidir quando uma execução bem-sucedida entra no histórico. A leitura do `localStorage` continua no `onMounted`, preservando o lifecycle anterior.",
            "A view continua responsável apenas por adaptar essas unidades ao contexto visual e às operações assíncronas: preencher o draft ao escolher uma conexão, restaurar query/tabela/banco quando possível, decidir quando uma execução bem-sucedida entra no histórico e entregar ao result view os dados retornados. A leitura do `localStorage` continua no `onMounted`, preservando o lifecycle anterior.",
            1,
          )
          docs = docs.replace(
            "Essa separação também facilita testes isolados: o serviço pode ser exercitado com uma implementação controlada da dependência read-only, cada adapter pode ser testado com uma factory de client nativo injetada, o store pode ter TTL e cleanup testados sem banco real, as rotas de sessão podem substituir diretamente `DatabaseExplorerService`, e os composables web podem validar sessão, histórico e conexões salvas sem montar a view inteira.",
            "Essa separação também facilita testes isolados: o serviço pode ser exercitado com uma implementação controlada da dependência read-only, cada adapter pode ser testado com uma factory de client nativo injetada, o store pode ter TTL e cleanup testados sem banco real, as rotas de sessão podem substituir diretamente `DatabaseExplorerService`, e os composables web podem validar sessão, histórico, conexões salvas, result view e paginação de tabelas sem montar a view inteira.",
            1,
          )
          docs = docs.replace(
            "A próxima etapa de frontend separa result view, busca, ordenação e paginação da `DatabaseView`, mantendo o storage versionado para o recorte específico posterior.",
            "A próxima etapa de frontend decompõe a `DatabaseView` em componentes visuais menores, preservando os composables já extraídos e mantendo o storage versionado para o recorte específico posterior.",
            1,
          )
          docs_path.write_text(docs)
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            apps/web/src/composables/useDatabaseResultView.ts \
            apps/web/src/composables/useDatabaseTableListView.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-explorer-result-view.test.ts \
            docs/architecture/database-explorer.md
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/composables/useDatabaseResultView.ts \
            apps/web/src/composables/useDatabaseTableListView.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-explorer-result-view.test.ts \
            docs/architecture/database-explorer.md
          if ! git diff --cached --quiet; then
            git commit -m "refactor(database): usa composables da visualização do Explorer"
            git push
          fi

name: Task 104 finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/task-104-eslint

      - name: Finalize task documentation and CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          old_ci = """      - name: Typecheck
                run: npm run typecheck

              - name: Build
                run: npm run build
          """
          new_ci = """      - name: Typecheck
                run: npm run typecheck

              - name: Lint
                run: npm run lint

              - name: Build
                run: npm run build
          """
          if old_ci not in ci:
              raise SystemExit('bloco esperado do CI não encontrado')
          ci_path.write_text(ci.replace(old_ci, new_ci, 1))

          pending_path = Path('docs/PENDENCIAS.md')
          pending = pending_path.read_text()
          replacements = {
              """- [ ] Implementar projetos recentes por workspace conforme
            `docs/tasks/NEXT.md`, registrando somente navegações deliberadas para o
            detalhe de um projeto conhecido e mantendo favoritos como prioridade.
          """: """- [ ] Fazer a revisão dirigida do `npm audit` conforme
            `docs/tasks/NEXT.md`, separando risco real, dependências de desenvolvimento e
            upgrades compatíveis sem usar `npm audit fix --force`.
          """,
              """- [ ] Padronizar lint e formatação com ESLint e Prettier entre `apps/` e
            `packages/`.
          """: """- [x] Padronizar lint com ESLint entre `apps/` e `packages/` — task 104:
            flat config na raiz, TypeScript/Vue/scripts cobertos, comandos `npm run lint` e
            `npm run lint:fix`, inventário incremental e gate no CI.
          - [ ] Avaliar Prettier e uma política de formatação automática em entrega própria,
            evitando um diff massivo misturado com mudanças funcionais.
          """,
              """- [ ] Fazer a segunda etapa de refatoração de
            `git-service.ts` e `script-execution-service.ts` (574 e 628 linhas — este
            último cresceu de novo desde a Fase 7, ver
            `docs/architecture/refactoring-arquivos-grandes.md`), sem mudar a API
            pública.
          """: """- [x] Fazer a segunda etapa de refatoração de `git-service.ts` e
            `script-execution-service.ts` — task 103: ambos viraram orquestradores finos
            com módulos por domínio, sem mudar a API pública.
          """,
          }
          for old, new in replacements.items():
              if old not in pending:
                  raise SystemExit(f'trecho esperado de PENDENCIAS.md não encontrado: {old[:60]!r}')
              pending = pending.replace(old, new, 1)
          pending_path.write_text(pending)

          readme_path = Path('docs/tasks/README.md')
          readme = readme_path.read_text()
          entry = "- `104-eslint-monorepo.md` — ESLint 9 em flat config para TypeScript, Vue e scripts do monorepo, com comandos de lint, inventário incremental sem falsos positivos de template e gate no CI.\n"
          if entry not in readme:
              readme_path.write_text(readme.rstrip() + '\n' + entry)

          Path('docs/tasks/104-eslint-monorepo.md').write_text('''# Task 104 — Padronizar lint com ESLint no monorepo

## Status

Concluída.

## Objetivo

Adicionar uma verificação estática compartilhada para os workspaces TypeScript,
os componentes Vue e os scripts Node da raiz, sem introduzir uma reforma de
formatação ou mudanças funcionais em massa.

## Resultado

- ESLint 9 configurado em `eslint.config.js` usando flat config;
- base `@eslint/js` para scripts JavaScript;
- `typescript-eslint` recomendado para `apps/**/*.ts` e `packages/**/*.ts`;
- `eslint-plugin-vue` com o preset essencial e parser TypeScript para SFCs;
- globals explícitos de Node e navegador conforme o contexto;
- scripts raiz `npm run lint` e `npm run lint:fix`;
- `npm run lint` adicionado ao CI depois de `typecheck` e antes de `build`;
- lockfile atualizado com versões fixadas das novas dependências de desenvolvimento;
- sete diretivas `eslint-disable` obsoletas removidas pela limpeza segura inicial.

## Decisões

### Sem Prettier nesta entrega

A task cobre apenas lint de correção. Formatação automática fica separada para
não gerar um diff grande e sem relação funcional.

### Adoção incremental

`no-unused-vars`, `no-explicit-any` e `prefer-const` começam como avisos. Isso
permite ligar o gate de CI agora e corrigir o legado por domínio antes de elevar
regras específicas a erro.

A primeira execução reportou 506 problemas. Desses, 495 eram falsos positivos
de variáveis do `<script setup>` usadas no template Vue. A regra de variáveis
não usadas foi desativada apenas para arquivos `.vue`; o preset essencial do
Vue e as demais regras continuam ativos.

Depois do ajuste e da limpeza segura, o inventário final ficou em:

- 0 erros;
- 22 avisos;
- 9 ocorrências de `prefer-const`;
- 13 variáveis/imports não usados em arquivos TypeScript ou scripts Node.

Os avisos restantes exigem julgamento por arquivo e não bloqueiam o CI nesta
primeira versão.

## Escopo verificado

```text
apps/**/*.{ts,vue}
packages/**/*.ts
scripts/**/*.mjs
eslint.config.js
```

Diretórios gerados, cobertura, dependências e runtime do Playwright permanecem
ignorados.

## Arquivos principais

- `eslint.config.js`;
- `package.json`;
- `package-lock.json`;
- `.github/workflows/ci.yml`;
- `docs/PENDENCIAS.md`;
- `docs/tasks/README.md`;
- `docs/tasks/NEXT.md`.

## Validação executada

- `npm install` com atualização do lockfile;
- `npm run lint` — 0 erros e 22 avisos catalogados;
- execução de `npm run lint:fix` durante o inventário inicial;
- remoção manualmente revisada das sete diretivas obsoletas encontradas pelo
  autofix;
- CI final do PR como validação de `typecheck`, lint, build, documentação da API,
  testes e smoke E2E.

## Limitações e próximos passos

- Prettier não foi introduzido;
- avisos legados não foram convertidos em erro;
- o CLI Bash continua fora do ESLint e exigiria uma frente própria com
  ShellCheck;
- a próxima elevação de severidade deve ocorrer por categoria, somente depois
  de zerar o inventário correspondente.
''')

          Path('docs/tasks/NEXT.md').write_text('''# Próxima atividade

## Task 105 — Revisão dirigida do `npm audit`

### Objetivo

Transformar o resultado atual do `npm audit` em um inventário confiável e
acionável, separando vulnerabilidades relevantes para o runtime local das que
existem apenas em ferramentas de desenvolvimento, sem usar correções forçadas
ou upgrades principais automáticos.

### Decisões principais

- executar `npm audit --json` a partir do lockfile atual e registrar o resultado
  de forma resumida na task, sem versionar saída bruta volátil;
- classificar cada achado por dependência direta/transitiva, runtime/dev,
  severidade, caminho de dependência e exposição real no modelo local do
  produto;
- preferir upgrades patch/minor compatíveis e deliberados;
- nunca executar `npm audit fix --force`;
- vulnerabilidades sem correção compatível devem ficar documentadas com risco,
  mitigação existente e condição objetiva para reavaliação.

### Escopo

- conferir `npm audit`, `npm outdated` e os manifests dos workspaces;
- identificar quais pacotes diretos controlam cada cadeia vulnerável;
- aplicar somente upgrades compatíveis que não exijam migração funcional;
- regenerar `package-lock.json` de forma determinística;
- validar lint, typecheck, build, documentação da API, testes e smoke E2E;
- atualizar `docs/PENDENCIAS.md`, o registro da task e este `NEXT.md`.

### Critérios de aceite

- inventário dos achados com decisão explícita para cada cadeia relevante;
- nenhum uso de `--force` e nenhum major upgrade escondido;
- upgrades aplicados têm justificativa e permanecem dentro do escopo;
- lockfile consistente com `npm ci`;
- CI completo aprovado.

### Fora de escopo

- modernização geral de dependências sem relação com vulnerabilidades;
- troca de framework, bundler ou runner de testes;
- correção de alertas do CLI Bash ou de dependências dos projetos gerenciados
  pelo dashboard;
- automatizar atualização recorrente de dependências nesta mesma entrega.
''')

          Path('.github/workflows/task-104-bootstrap.yml').unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: conclui a task 104 e prepara a próxima atividade"
          git push origin HEAD:chore/task-104-eslint

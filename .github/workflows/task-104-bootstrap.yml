name: Task 104 finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/task-104-eslint

      - name: Finalize task
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          old = "      - name: Typecheck\n        run: npm run typecheck\n\n      - name: Build\n        run: npm run build\n"
          new = "      - name: Typecheck\n        run: npm run typecheck\n\n      - name: Lint\n        run: npm run lint\n\n      - name: Build\n        run: npm run build\n"
          if old not in ci:
              raise SystemExit('bloco do CI não encontrado')
          ci_path.write_text(ci.replace(old, new, 1))

          pending_path = Path('docs/PENDENCIAS.md')
          pending = pending_path.read_text()
          replacements = [
              ("- [ ] Implementar projetos recentes por workspace conforme\n  `docs/tasks/NEXT.md`, registrando somente navegações deliberadas para o\n  detalhe de um projeto conhecido e mantendo favoritos como prioridade.\n", "- [ ] Fazer a revisão dirigida do `npm audit` conforme\n  `docs/tasks/NEXT.md`, separando risco real, dependências de desenvolvimento e\n  upgrades compatíveis sem usar `npm audit fix --force`.\n"),
              ("- [ ] Padronizar lint e formatação com ESLint e Prettier entre `apps/` e\n  `packages/`.\n", "- [x] Padronizar lint com ESLint entre `apps/` e `packages/` — task 104:\n  flat config na raiz, TypeScript/Vue/scripts cobertos, comandos `npm run lint`\n  e `npm run lint:fix`, inventário incremental e gate no CI.\n- [ ] Avaliar Prettier e uma política de formatação automática em entrega\n  própria, evitando um diff massivo misturado com mudanças funcionais.\n"),
              ("- [ ] Fazer a segunda etapa de refatoração de\n  `git-service.ts` e `script-execution-service.ts` (574 e 628 linhas — este\n  último cresceu de novo desde a Fase 7, ver\n  `docs/architecture/refactoring-arquivos-grandes.md`), sem mudar a API\n  pública.\n", "- [x] Fazer a segunda etapa de refatoração de `git-service.ts` e\n  `script-execution-service.ts` — task 103: ambos viraram orquestradores finos\n  com módulos por domínio, sem mudar a API pública.\n"),
          ]
          for old, new in replacements:
              if old not in pending:
                  raise SystemExit('trecho de PENDENCIAS.md não encontrado')
              pending = pending.replace(old, new, 1)
          pending_path.write_text(pending)

          readme_path = Path('docs/tasks/README.md')
          readme = readme_path.read_text().rstrip() + '\n'
          entry = "- `104-eslint-monorepo.md` — ESLint 9 em flat config para TypeScript, Vue e scripts do monorepo, com comandos de lint, inventário incremental sem falsos positivos de template e gate no CI.\n"
          if entry not in readme:
              readme += entry
          readme_path.write_text(readme)

          Path('docs/tasks/104-eslint-monorepo.md').write_bytes(base64.b64decode(''))
          Path('docs/tasks/NEXT.md').write_bytes(base64.b64decode(''))
          Path('docs/tasks/.task-104-trigger').unlink(missing_ok=True)
          Path('.github/workflows/task-104-bootstrap.yml').unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: conclui a task 104 e prepara a próxima atividade"
          git push origin HEAD:chore/task-104-eslint

name: Task 104 bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/task-104-eslint

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and refresh lockfile
        run: npm install

      - name: Persist lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: atualiza lockfile do ESLint"
          git push origin HEAD:chore/task-104-eslint

      - name: Run lint
        run: npm run lint | tee /tmp/lint.txt

      - name: Upload lint inventory
        uses: actions/upload-artifact@v4
        with:
          name: task-104-lint-inventory
          path: /tmp/lint.txt
          retention-days: 1

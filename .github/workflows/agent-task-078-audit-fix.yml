name: Agent task 078 audit fix

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-audit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply compatible audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Refresh audit report
        run: npm audit --json > .agent-task-078-audit.json || true

      - name: Commit compatible dependency fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .agent-task-078-audit.json
          git commit -m "Atualiza dependências transitivas vulneráveis"
          git push origin HEAD:agent/task-078-js-ts-lsp

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format diagnostic
        run: |
          npx prettier --write \
            apps/api/src/routes/ai-providers.ts \
            apps/api/src/services/ai-implementation-execution-service.ts \
            apps/api/src/services/ai-provider-resolver.ts \
            apps/api/test/ai-provider-resolver.test.ts \
            apps/web/src/components/ProjectAiAssistantPanel.vue \
            packages/core/src/project-ai-consent-repository.ts \
            packages/core/src/project-ai-selection-repository.ts
          git diff -- \
            apps/api/src/routes/ai-providers.ts \
            apps/api/src/services/ai-implementation-execution-service.ts \
            apps/api/src/services/ai-provider-resolver.ts \
            apps/api/test/ai-provider-resolver.test.ts \
            apps/web/src/components/ProjectAiAssistantPanel.vue \
            packages/core/src/project-ai-consent-repository.ts \
            packages/core/src/project-ai-selection-repository.ts
          exit 1

  e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Smoke E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/.runtime/report
          retention-days: 7

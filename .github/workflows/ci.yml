name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Format diagnostics
        run: |
          npx prettier --write apps/api/src/services/docker-compose-ownership-store.ts apps/api/test/docker-compose-ownership-store.test.ts
          git diff -- apps/api/src/services/docker-compose-ownership-store.ts apps/api/test/docker-compose-ownership-store.test.ts

      - name: Quality gate
        run: npm run check

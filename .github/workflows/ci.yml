name: CI

# O mesmo gate de `npm run check`, dividido em jobs paralelos. O job final
# "Validate" mantém o nome do check estável e só passa se todos os outros passarem.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - LICENSE
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          native-modules: esbuild

      - name: Cache de ESLint e Prettier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck dos testes do web
        run: npm run typecheck:tests --workspace=@dev-dashboard/web

      - name: Build
        run: npm run build:apps

  test-api:
    name: Testes da API (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # O tsx transpila cada arquivo de teste num processo próprio e guarda o
      # resultado em /tmp/tsx-<uid>; reaproveitar o cache evita refazer tudo.
      - name: Cache do tsx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/tsx-*
          key: tsx-api-${{ runner.os }}-${{ hashFiles('apps/api/src/**', 'apps/api/test/**', 'packages/*/src/**') }}-${{ matrix.shard }}
          restore-keys: |
            tsx-api-${{ runner.os }}-

      - name: Testes
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
        run: npm run test:shard --workspace=@dev-dashboard/api

  test-web:
    name: Testes do web (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          native-modules: esbuild

      - name: Testes
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: npm run test:shard --workspace=@dev-dashboard/web

  test-rest:
    name: Testes dos packages e scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Packages
        run: >-
          npm run test
          --workspace=@dev-dashboard/core
          --workspace=@dev-dashboard/process-manager
          --workspace=@dev-dashboard/project-discovery
          --workspace=@dev-dashboard/agent-runtime

      - name: Scripts
        run: node --test scripts/*.test.mjs

  validate:
    name: Validate
    if: ${{ always() }}
    needs: [static, test-api, test-web, test-rest]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Todos os jobs passaram
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Algum job falhou, foi cancelado ou foi pulado: ${{ join(needs.*.result, ', ') }}"
          exit 1

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Quality gate
        run: npm run check


  terminal-e2e:
    name: Terminal E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      # ubuntu-latest already supplies Chromium's runtime libraries; --with-deps
      # runs apt-get against external mirrors and can exhaust the E2E timeout.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Qualify terminal and critical Git flows
        run: npm run test:e2e --workspace=@dev-dashboard/web -- dashboard-terminal-qualification.spec.ts project-git-pull-request.spec.ts project-worktrees-environments.spec.ts project-git-history.spec.ts project-tests.spec.ts project-dependencies.spec.ts project-dev-container.spec.ts project-compose.spec.ts project-production.spec.ts project-environment.spec.ts project-database.spec.ts database-explorer-privacy.spec.ts

  runtime-physical-isolation:
    name: Disposable PostgreSQL Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pull fixture PostgreSQL image
        run: docker pull postgres:16-alpine

      - name: Qualify disposable DB volumes and real Git worktrees
        env:
          RUNTIME_ISOLATION_QUALIFY: '1'
        run: node scripts/qualify-runtime-profile-isolation.mjs


  agent-physical-lock-qualification:
    name: Agent Physical Lock Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build canonical Agent runtime
        run: npm run build:packages

      - name: Qualify real process locks and crash recovery
        env:
          AGENT_LOCK_QUALIFY: '1'
        run: node scripts/qualify-agent-lock-ownership.mjs

  agent-physical-process-restart:
    name: Agent Physical Process Restart
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build canonical Agent runtime
        run: npm run build:packages

      - name: Qualify real process restart with persisted canonical stores
        env:
          AGENT_RESTART_QUALIFY: '1'
        run: node scripts/qualify-agent-process-restart.mjs

  disposable-systemd-user-fixture:
    name: Disposable Systemd User Fixture
    # Opt-in by PR title; never run systemd mutations on ordinary CI/main.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[systemd-fixture]')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild

      - name: Build package dependencies
        run: npm run build:packages

      - name: Qualify dedicated disposable systemd user unit
        run: bash scripts/qualify-systemd-user-fixture.sh

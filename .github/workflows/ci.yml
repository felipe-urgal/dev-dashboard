name: CI

on:
  push:
    branches:
      - main
      - feat/593-security-center-api
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Corrigir composition root do Security Center
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/app.ts')
          text = path.read_text()
          text = text.replace("import type { SecurityScannerProvider } from './services/security-scanner-provider.js';\nimport { TrivySecurityProvider } from './services/trivy-security-provider.js';\nimport type { SecurityScanResult } from './services/trivy-security-scanner.js';\n", "")
          text = text.replace("  securityScannerProvider?: SecurityScannerProvider<SecurityScanResult>;\n", "")
          old = "    releaseReadinessService,\n  } = composition;\n  const securityScannerProvider =\n    options.securityScannerProvider ?? new TrivySecurityProvider();\n"
          new = "    releaseReadinessService,\n    securityScannerProvider,\n  } = composition;\n"
          if old not in text:
              raise SystemExit('Trecho esperado do composition root não encontrado')
          path.write_text(text.replace(old, new))
          PY

      - name: Quality gate
        run: npm run check

      - name: Check API reference
        run: npm run docs:api:check

      - name: Commit composition root corrigido
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- apps/api/src/app.ts; then
            echo "Composition root already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts
          git commit -m "refactor: reutilizar provider composto no Security Center"
          git push origin HEAD:${{ github.ref_name }}

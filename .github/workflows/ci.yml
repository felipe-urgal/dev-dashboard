name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event_name == 'pull_request'
    name: Format branch (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: npx prettier --write apps/api/src/services/ai-assistant-service.ts apps/api/src/services/ai-orchestrator.ts apps/api/src/services/ollama-provider.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/api/src/services/ai-assistant-service.ts apps/api/src/services/ai-orchestrator.ts apps/api/src/services/ollama-provider.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/ai-assistant-service.ts apps/api/src/services/ai-orchestrator.ts apps/api/src/services/ollama-provider.ts
          git commit -m "style: aplica prettier nos providers de IA"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verifica docs/architecture/api-reference.md
        run: npm run docs:api:check

      - name: Test
        run: npm test

  e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Smoke E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/.runtime/report
          retention-days: 7

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install coordinated ESLint 10 toolchain
        run: npm install --ignore-scripts --save-dev eslint@10.0.1 @eslint/js@10.0.1

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Quality gate
        run: npm run check

      - name: Commit coordinated dependency manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifests already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps-dev): alinhar ESLint 10"
          git push origin HEAD:${{ github.head_ref }}

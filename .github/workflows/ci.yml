name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply pending review fixes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one literal match, found {count}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          process_manager = 'packages/process-manager/src/process-manager.ts'

          replace_once(
              process_manager,
              """    const current = previous.catch(() => undefined).then(action);
              this.startLocks.set(
                key,
                current.catch(() => undefined),
              );
              try {
                return await current;
              } finally {
                if (this.startLocks.get(key) === current) {
                  this.startLocks.delete(key);
                }
              }
          """,
              """    const current = previous.catch(() => undefined).then(action);
              const tail = current.then(
                () => undefined,
                () => undefined,
              );
              this.startLocks.set(key, tail);
              try {
                return await current;
              } finally {
                if (this.startLocks.get(key) === tail) {
                  this.startLocks.delete(key);
                }
              }
          """,
          )

          replace_once(
              process_manager,
              """        const finalStatus: 'stopped' | 'failed' =
                  storedProcess.status === 'stopping'
                    ? 'stopped'
                    : exitCode === 0
                      ? 'stopped'
                      : 'failed';
          """,
              """        const finalStatus: 'stopped' | 'failed' =
                  storedProcess.status === 'stopping'
                    ? 'stopped'
                    : kind === 'test' && exitCode === 0
                      ? 'stopped'
                      : 'failed';
          """,
          )

          panel_path = Path('apps/web/src/components/ProjectTestsPanel.vue')
          panel = panel_path.read_text(encoding='utf-8')
          panel_pattern = re.compile(
              r"function formatTimestamp\(value: string \| undefined\): string \{.*?"
              r"watch\(\n  \(\) => props\.project\.id,\n  \(\) => \{.*?"
              r"  \{ immediate: true \},\n\);",
              re.DOTALL,
          )
          panel_replacement = """function formatTimestamp(value: string | undefined): string {
            if (!value) return '—';
            return new Intl.DateTimeFormat('pt-BR', {
              dateStyle: 'short',
              timeStyle: 'medium',
            }).format(new Date(value));
          }

          function isCurrentProjectRequest(
            projectId: string,
            requestGeneration: number,
          ): boolean {
            return (
              props.project.id === projectId &&
              generation === requestGeneration
            );
          }

          async function loadOverview(refresh = false): Promise<void> {
            const projectId = props.project.id;
            const requestGeneration = generation;
            loadingOverview.value = true;
            errorMessage.value = '';
            consecutiveFailures = 0;
            try {
              const result = await fetchProjectTests(projectId, { refresh });
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                overview.value = result;
              }
            } catch (error) {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível carregar os comandos de teste.';
              }
            } finally {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                loadingOverview.value = false;
              }
            }
          }

          async function refreshProcess(): Promise<boolean> {
            const projectId = props.project.id;
            const requestGeneration = generation;
            try {
              const result = await fetchProjectTestProcess(projectId);
              if (!isCurrentProjectRequest(projectId, requestGeneration)) return true;
              managedProcess.value = result;

              if (result) {
                const log = await fetchProjectTestLog(projectId).catch(() => null);
                if (!isCurrentProjectRequest(projectId, requestGeneration)) return true;
                if (log) {
                  logContent.value = log.content;
                  logTruncated.value = log.truncated;
                }
              } else {
                logContent.value = '';
                logTruncated.value = false;
              }
              consecutiveFailures = 0;
              return true;
            } catch (error) {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível atualizar o processo de testes.';
              }
              return false;
            }
          }

          function schedulePolling(): void {
            clearPolling();
            pollTimer = setTimeout(async () => {
              if (!isRunning.value) return;
              const succeeded = await refreshProcess();
              if (succeeded) {
                consecutiveFailures = 0;
                schedulePolling();
                return;
              }
              consecutiveFailures += 1;
              if (consecutiveFailures >= MAX_POLL_FAILURES) {
                errorMessage.value =
                  'Interrompendo atualização automática após falhas consecutivas. Use Atualizar para tentar novamente.';
                return;
              }
              schedulePolling();
            }, 1500);
          }

          function clearPolling(): void {
            if (pollTimer !== null) {
              clearTimeout(pollTimer);
              pollTimer = null;
            }
          }

          async function handleStart(commandId: string): Promise<void> {
            const projectId = props.project.id;
            const requestGeneration = generation;
            startingCommandId.value = commandId;
            errorMessage.value = '';
            try {
              const result = await startProjectTest(projectId, commandId);
              if (!isCurrentProjectRequest(projectId, requestGeneration)) return;
              managedProcess.value = result;
              logContent.value = '';
              logTruncated.value = false;
              schedulePolling();
            } catch (error) {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível iniciar os testes.';
              }
            } finally {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                startingCommandId.value = null;
              }
            }
          }

          async function handleStop(): Promise<void> {
            const projectId = props.project.id;
            const requestGeneration = generation;
            stopping.value = true;
            errorMessage.value = '';
            try {
              const result = await stopProjectTest(projectId);
              if (!isCurrentProjectRequest(projectId, requestGeneration)) return;
              managedProcess.value = result;
              await refreshProcess();
            } catch (error) {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível interromper os testes.';
              }
            } finally {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                stopping.value = false;
              }
            }
          }

          async function handleClearLogs(): Promise<void> {
            const projectId = props.project.id;
            const requestGeneration = generation;
            errorMessage.value = '';
            try {
              const log = await clearProjectTestLog(projectId);
              if (!isCurrentProjectRequest(projectId, requestGeneration)) return;
              logContent.value = log.content;
              logTruncated.value = log.truncated;
            } catch (error) {
              if (isCurrentProjectRequest(projectId, requestGeneration)) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível limpar o log.';
              }
            }
          }

          watch(
            () => props.project.id,
            () => {
              generation += 1;
              clearPolling();
              consecutiveFailures = 0;
              overview.value = null;
              managedProcess.value = null;
              logContent.value = '';
              logTruncated.value = false;
              startingCommandId.value = null;
              stopping.value = false;
              errorMessage.value = '';
              void loadOverview();
              void refreshProcess();
            },
            { immediate: true },
          );"""
          panel, count = panel_pattern.subn(panel_replacement, panel, count=1)
          if count != 1:
              raise SystemExit(f'{panel_path}: expected one panel block, found {count}')
          panel_path.write_text(panel, encoding='utf-8')

          test_path = 'packages/process-manager/test/process-manager.test.ts'
          replace_once(
              test_path,
              '      args: ["-e", "setTimeout(() => process.exit(0), 200)"]',
              '      args: ["-e", "setInterval(() => {}, 60_000)"]',
          )
          replace_once(
              test_path,
              '    killIfAlive(success.value.pid);',
              '    await fixture.manager.stopTest(fixture.project.id);',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit validated review fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add packages/process-manager/src/process-manager.ts \
            packages/process-manager/test/process-manager.test.ts \
            apps/web/src/components/ProjectTestsPanel.vue
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git commit -m "fix: finalize project tests review adjustments"
          git push origin "HEAD:$HEAD_REF"

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Quality gate
        run: npm run check


  terminal-e2e:
    name: Terminal E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare native dependencies
        run: npm rebuild esbuild node-pty

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Qualify terminal and critical Git flows
        run: npm run test:e2e --workspace=@dev-dashboard/web -- dashboard-terminal-qualification.spec.ts project-git-pull-request.spec.ts project-worktrees-environments.spec.ts project-git-history.spec.ts project-tests.spec.ts project-dependencies.spec.ts project-dev-container.spec.ts project-compose.spec.ts project-production.spec.ts project-environment.spec.ts

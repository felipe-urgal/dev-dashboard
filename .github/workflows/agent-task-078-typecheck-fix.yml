name: Agent task 078 typecheck fix

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-typecheck-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp

      - name: Fix exact optional property types
        run: |
          python <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/services/project-language-server-service.ts')
          content = service.read_text()
          content = content.replace(
              "  socket?: WebSocket;\n  state: 'starting' | 'ready' | 'failed';\n  lastStartedAt: string;\n  idleTimer?: NodeJS.Timeout;\n  forceKillTimer?: NodeJS.Timeout;",
              "  socket: WebSocket | undefined;\n  state: 'starting' | 'ready' | 'failed';\n  lastStartedAt: string;\n  idleTimer: NodeJS.Timeout | undefined;\n  forceKillTimer: NodeJS.Timeout | undefined;",
          )
          content = content.replace(
              "      decoder: new LspMessageDecoder(),\n      state: 'starting',\n      lastStartedAt: new Date(now).toISOString(),",
              "      decoder: new LspMessageDecoder(),\n      socket: undefined,\n      state: 'starting',\n      lastStartedAt: new Date(now).toISOString(),\n      idleTimer: undefined,\n      forceKillTimer: undefined,",
          )
          service.write_text(content)

          client = Path('apps/web/src/language-server/project-language-server-client.ts')
          web = client.read_text()
          web = web.replace(
              "  private socket?: WebSocket;",
              "  private socket: WebSocket | undefined;",
          )
          web = web.replace(
              "        kind: symbolKind(\n          this.monaco,\n          typeof item.kind === 'number' ? item.kind : undefined,\n        ),\n        range: monacoRange(range),",
              "        kind: symbolKind(\n          this.monaco,\n          typeof item.kind === 'number' ? item.kind : undefined,\n        ),\n        tags: [],\n        range: monacoRange(range),",
          )
          client.write_text(web)
          PY

      - name: Commit type fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/services/project-language-server-service.ts apps/web/src/language-server/project-language-server-client.ts
          git commit -m "Corrige tipagem estrita do cliente LSP"
          git push origin HEAD:agent/task-078-js-ts-lsp

name: Temporary Database Error Contract Format

on:
  push:
    branches:
      - refactor/database-explorer-error-contract
    paths:
      - .github/workflows/tmp-format-database-error-contract.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/database-explorer-error-contract

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            apps/web/src/api/database-explorer-errors.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-explorer-errors.test.ts
          git diff --check

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/api/database-explorer-errors.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-explorer-errors.test.ts
          git commit -m "style(database): formata contrato de erros"
          git push origin HEAD:refactor/database-explorer-error-contract

name: Temporary Database Components Refactor

on:
  push:
    branches:
      - refactor/database-services-dialog-components

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/database-services-dialog-components
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply refactor
        run: node scripts/tmp-refactor-database-components.mjs

      - name: Format affected files
        run: |
          npx prettier --write \
            apps/web/src/components/database/DatabaseConnectionDialog.vue \
            apps/web/src/components/database/DatabaseServicesPanel.vue \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-machine-components.test.ts \
            docs/architecture/database-explorer.md

      - name: Build packages
        run: npm run build:packages

      - name: Typecheck web
        run: npm run typecheck --workspace=@dev-dashboard/web

      - name: Typecheck web tests
        run: npx tsc -p apps/web/tsconfig.test.json --noEmit

      - name: Lint affected files
        run: |
          npx eslint \
            apps/web/src/components/database/DatabaseConnectionDialog.vue \
            apps/web/src/components/database/DatabaseServicesPanel.vue \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-machine-components.test.ts

      - name: Test extracted components
        working-directory: apps/web
        run: npx vitest run test/database-machine-components.test.ts test/database-explorer-components.test.ts

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/database/DatabaseConnectionDialog.vue \
            apps/web/src/components/database/DatabaseServicesPanel.vue \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-machine-components.test.ts \
            docs/architecture/database-explorer.md
          git commit -m "refactor(database): compõe painel e diálogo extraídos"

      - name: Remove temporary tooling
        run: |
          rm scripts/tmp-refactor-database-components.mjs
          rm .github/workflows/tmp-refactor-database-components.yml
          git add -u scripts/tmp-refactor-database-components.mjs .github/workflows/tmp-refactor-database-components.yml
          git commit -m "chore(ci): remove tooling temporário do refactor"
          git push origin HEAD:refactor/database-services-dialog-components

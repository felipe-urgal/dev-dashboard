name: Agent task index patch

on:
  push:
    branches:
      - agent/fix-editor-page-scroll
    paths:
      - .github/workflows/agent-task-index-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-editor-page-scroll

      - name: Update task index
        run: |
          python <<'PY'
          from pathlib import Path

          index = Path('docs/tasks/README.md')
          content = index.read_text().rstrip()
          entries = [
              '- `077-safe-editor-save.md` — editor de texto seguro com salvamento versionado, operações estruturais confirmadas, watcher dos arquivos abertos, comparação em três vias e `WorkspaceEdit` textual com rollback.',
              '- `078-javascript-typescript-lsp.md` — plano do LSP JavaScript/TypeScript com gateway autenticado, processo sob demanda, recursos semânticos e revisão segura de `WorkspaceEdit`.',
          ]
          for entry in entries:
              if entry not in content:
                  content += '\n' + entry
          index.write_text(content + '\n')
          PY

      - name: Commit index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/tasks/README.md
          git commit -m "Atualiza índice das tasks 077 e 078"
          git push origin HEAD:agent/fix-editor-page-scroll

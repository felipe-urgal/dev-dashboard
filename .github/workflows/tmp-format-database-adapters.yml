name: Temporary Database Adapters Format

on:
  push:
    branches:
      - refactor/database-explorer-adapters
    paths:
      - .github/workflows/tmp-format-database-adapters.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/database-explorer-adapters

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            apps/api/src/services/database-explorer-adapter.ts \
            apps/api/src/services/database-explorer-cli.ts \
            apps/api/src/services/database-explorer-service.ts \
            apps/api/src/services/database-readonly-service.ts \
            apps/api/src/services/mysql-explorer-adapter.ts \
            apps/api/src/services/postgres-explorer-adapter.ts \
            apps/api/test/database-explorer-adapters.test.ts
          git diff --check

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services apps/api/test/database-explorer-adapters.test.ts
          git commit -m "style(database): formata adapters do explorer"
          git push origin HEAD:refactor/database-explorer-adapters

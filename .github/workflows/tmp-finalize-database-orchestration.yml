name: Temporary Database Orchestration Validation

on:
  push:
    branches:
      - refactor/database-orchestration-composables

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/database-orchestration-composables
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply documentation update
        run: node scripts/tmp-finalize-database-orchestration.mjs

      - name: Format affected files
        run: |
          npx prettier --write \
            apps/web/src/composables/useMachineDatabaseServices.ts \
            apps/web/src/composables/useDatabaseQueryExecution.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-orchestration-composables.test.ts \
            docs/architecture/database-explorer.md

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck web tests
        run: npx tsc -p apps/web/tsconfig.test.json --noEmit

      - name: Lint affected files
        run: |
          npx eslint \
            apps/web/src/composables/useMachineDatabaseServices.ts \
            apps/web/src/composables/useDatabaseQueryExecution.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-orchestration-composables.test.ts

      - name: Test orchestration and related database units
        working-directory: apps/web
        run: npx vitest run test/database-orchestration-composables.test.ts test/database-machine-components.test.ts test/database-explorer-components.test.ts test/database-explorer-session.test.ts

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/composables/useMachineDatabaseServices.ts \
            apps/web/src/composables/useDatabaseQueryExecution.ts \
            apps/web/src/views/DatabaseView.vue \
            apps/web/test/database-orchestration-composables.test.ts \
            docs/architecture/database-explorer.md
          if ! git diff --cached --quiet; then
            git commit -m "refactor(database): finaliza orquestração em composables"
          fi

      - name: Remove temporary tooling
        run: |
          rm scripts/tmp-finalize-database-orchestration.mjs
          rm .github/workflows/tmp-finalize-database-orchestration.yml
          git add -u scripts/tmp-finalize-database-orchestration.mjs .github/workflows/tmp-finalize-database-orchestration.yml
          git commit -m "chore(ci): remove validação temporária do refactor"
          git push origin HEAD:refactor/database-orchestration-composables

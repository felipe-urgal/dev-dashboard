name: Fix PR 505 stale planner test

on:
  push:
    branches:
      - feature/vercel-git-managed-deploy
    paths:
      - .github/workflows/diagnose-pr-505.yml

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update stale planner expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/test/deployment-domain.test.ts')
          text = path.read_text()
          old = """      error instanceof DeploymentError &&\n      error.code === 'DEPLOYMENT_STRATEGY_UNSUPPORTED',\n  );\n\n  assert.throws(\n    () =>\n      planner.build(\n        makeProject({\n          commands:"""
          new = """      error instanceof DeploymentError &&\n      error.code === 'DEPLOYMENT_PRODUCTION_UNAVAILABLE',\n  );\n\n  assert.throws(\n    () =>\n      planner.build(\n        makeProject({\n          commands:"""
          if old not in text:
              raise SystemExit('expected stale planner assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test fix
        run: |
          git add apps/api/test/deployment-domain.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align git-managed planner expectation"
      - name: Push test fix
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

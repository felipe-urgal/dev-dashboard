name: Format OpenAI provider

on:
  push:
    branches:
      - agent/openai-cloud-provider

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/openai-cloud-provider
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/services/openai-provider.ts apps/api/test/openai-provider.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/openai-provider.ts apps/api/test/openai-provider.test.ts
          git commit -m "style: formata provider OpenAI"
          git push

name: Temporary generate API docs for environment reveal

on:
  push:
    branches:
      - feature/exibir-valores-variaveis-ambiente

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exibir-valores-variaveis-ambiente
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:api
      - name: Commit generated reference
        run: |
          if git diff --quiet -- docs/architecture/api-reference.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/api-reference.md
          git commit -m "docs: atualiza referência da API para exibição de variáveis"
          git push origin HEAD:feature/exibir-valores-variaveis-ambiente

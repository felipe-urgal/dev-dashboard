name: Temporary Database API Docs Update

on:
  push:
    branches:
      - refactor/database-explorer-session-store

permissions:
  contents: write

jobs:
  update-api-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/database-explorer-session-store
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API reference
        run: npm run docs:api

      - name: Commit generated API reference
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/api-reference.md; then
            echo "API reference already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/api-reference.md
          git commit -m "docs(api): atualiza referência do explorer"
          git push origin HEAD:refactor/database-explorer-session-store

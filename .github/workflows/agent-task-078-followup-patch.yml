name: Agent task 078 follow-up patch

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-followup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp

      - name: Patch editor synchronization and test mocks
        run: |
          python <<'PY'
          from pathlib import Path

          editor = Path('apps/web/src/components/ProjectEmbeddedEditor.vue')
          content = editor.read_text()

          def replace_once(old: str, new: str) -> None:
              global content
              if old not in content:
                  raise SystemExit(f'editor pattern not found:\n{old}')
              content = content.replace(old, new, 1)

          replace_once(
              "function replaceOpenFile(file: ProjectFileContent): void {\n  openFiles.value = openFiles.value.map((opened) =>\n    opened.path === file.path ? file : opened,\n  );\n}",
              "function replaceOpenFile(file: ProjectFileContent): void {\n  openFiles.value = openFiles.value.map((opened) =>\n    opened.path === file.path ? file : opened,\n  );\n  languageServerClient?.savedFile(file);\n}",
          )
          replace_once(
              "    replaceOpenFile(saved);\n    languageServerClient?.savedFile(saved);\n    setDirty(file.path, false);",
              "    replaceOpenFile(saved);\n    setDirty(file.path, false);",
          )
          replace_once(
              "    replaceOpenFile(file);\n    replaceModelContent(file);\n    setDirty(file.path, false);\n    languageServerClient?.savedFile(file);",
              "    replaceOpenFile(file);\n    replaceModelContent(file);\n    setDirty(file.path, false);",
          )
          replace_once(
              "async function resetProject(): Promise<void> {\n  editor?.setModel(null);",
              "async function resetProject(): Promise<void> {\n  languageServerClient?.dispose();\n  languageServerClient = undefined;\n  languageServerStatus.value = null;\n  languageServerDiagnostics.value = '';\n  workspaceEditPreview.value = null;\n  editor?.setModel(null);",
          )
          replace_once(
              "  errorMessage.value = '';\n  statusMessage.value = '';\n  createLanguageServerClient();\n  loadingTree.value = true;",
              "  errorMessage.value = '';\n  statusMessage.value = '';\n  if (monaco) createLanguageServerClient();\n  loadingTree.value = true;",
          )
          editor.write_text(content)

          test_file = Path('apps/web/test/project-embedded-editor.test.ts')
          test = test_file.read_text()

          def replace_test(old: str, new: str) -> None:
              global test
              if old not in test:
                  raise SystemExit(f'test pattern not found:\n{old}')
              test = test.replace(old, new, 1)

          replace_test(
              "  watch: vi.fn(),\n}));",
              "  watch: vi.fn(),\n  languageStatus: vi.fn(),\n  workspacePreview: vi.fn(),\n  workspaceApply: vi.fn(),\n}));",
          )
          replace_test(
              "  const state: {\n    value: string;\n    listener: (() => void) | undefined;\n  } = { value: '', listener: undefined };\n  const model = {",
              "  const state: {\n    value: string;\n    listener: (() => void) | undefined;\n    uri: unknown;\n  } = { value: '', listener: undefined, uri: '' };\n  const disposable = () => ({ dispose: vi.fn() });\n  const model = {\n    get uri() { return state.uri; },",
          )
          replace_test(
              "      state.value = content;\n      return model;",
              "      state.value = content;\n      state.uri = _uri;\n      return model;",
          )
          replace_test(
              "    setTheme: vi.fn(),\n  },\n}));",
              "    setTheme: vi.fn(),\n    setModelMarkers: vi.fn(),\n  },\n  MarkerSeverity: { Hint: 1, Info: 2, Warning: 4, Error: 8 },\n  MarkerTag: { Unnecessary: 1, Deprecated: 2 },\n  languages: {\n    CompletionItemKind: new Proxy({}, { get: (_target, key) => String(key) }),\n    SymbolKind: new Proxy({}, { get: (_target, key) => String(key) }),\n    CompletionItemInsertTextRule: { InsertAsSnippet: 4 },\n    registerHoverProvider: vi.fn(disposable),\n    registerDefinitionProvider: vi.fn(disposable),\n    registerReferenceProvider: vi.fn(disposable),\n    registerCompletionItemProvider: vi.fn(disposable),\n    registerDocumentSymbolProvider: vi.fn(disposable),\n  },\n}));",
          )
          replace_test(
              "  watchProjectFiles: api.watch,\n}));",
              "  watchProjectFiles: api.watch,\n  fetchProjectLanguageServerStatus: api.languageStatus,\n  projectLanguageServerWebSocketUrl: vi.fn(() => 'ws://localhost/lsp'),\n  previewProjectWorkspaceEdit: api.workspacePreview,\n  applyProjectWorkspaceEdit: api.workspaceApply,\n}));",
          )
          replace_test(
              "  monaco.state.listener = undefined;\n  api.directory.mockResolvedValue({",
              "  monaco.state.listener = undefined;\n  monaco.state.uri = '';\n  api.languageStatus.mockResolvedValue({\n    kind: 'javascript-typescript',\n    supported: true,\n    available: false,\n    state: 'unavailable',\n    activeConnections: 0,\n    message: 'Servidor indisponível no teste.',\n  });\n  api.workspacePreview.mockResolvedValue({\n    confirmationToken: 'c'.repeat(64),\n    expiresAt: new Date().toISOString(),\n    files: [],\n  });\n  api.workspaceApply.mockResolvedValue({ files: [] });\n  api.directory.mockResolvedValue({",
          )
          test_file.write_text(test)
          PY

      - name: Commit follow-up patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/ProjectEmbeddedEditor.vue apps/web/test/project-embedded-editor.test.ts
          git commit -m "Ajusta sincronização e mocks do LSP"
          git push origin HEAD:agent/task-078-js-ts-lsp

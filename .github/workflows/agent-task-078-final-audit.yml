name: Agent task 078 final audit

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-final-audit.yml

permissions:
  contents: write

jobs:
  audit-and-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Inspect dependency audit
        run: npm audit --json || true

      - name: Update task index
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/tasks/README.md')
          content = path.read_text().rstrip()
          entry = '- `079-ruby-rails-lsp.md` — plano do LSP Ruby/Rails com catálogo fechado, Ruby estático, Rails runtime opt-in e reutilização do gateway e do `WorkspaceEdit` seguro.'
          if entry not in content:
              content += '\n' + entry
          path.write_text(content + '\n')
          PY

      - name: Commit task index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/tasks/README.md
          git commit -m "Adiciona Task 079 ao índice"
          git push origin HEAD:agent/task-078-js-ts-lsp

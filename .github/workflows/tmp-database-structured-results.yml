name: Temporary Database Structured Results

on:
  push:
    branches:
      - refactor/database-explorer-structured-results
    paths:
      - .github/workflows/tmp-database-structured-results.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update lockfile and install formatter
        run: npm install --ignore-scripts

      - name: Update Database Explorer docs
        run: python scripts/tmp-update-database-structured-docs.py

      - name: Format changed sources and docs
        run: >-
          npx prettier --write
          apps/api/package.json
          apps/api/src/services/database-explorer-adapter.ts
          apps/api/src/services/database-explorer-driver.ts
          apps/api/src/services/database-readonly-service.ts
          apps/api/src/services/postgres-explorer-adapter.ts
          apps/api/src/services/mysql-explorer-adapter.ts
          apps/api/test/database-readonly-service.test.ts
          apps/api/test/database-explorer-adapters.test.ts
          docs/architecture/database-explorer.md
          docs/architecture/security.md
          docs/guia/banco-de-dados.md

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/api docs/architecture/database-explorer.md docs/architecture/security.md docs/guia/banco-de-dados.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(database): atualiza lock e documentação estruturada"
            git push
          fi

name: Consolidate PR 194

on:
  pull_request:
    branches:
      - fix/git-commit-tracked-default
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'automation/pr-194-consolidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout da branch técnica
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Aplicar correções funcionais
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          target = Path('packages/process-manager/src/server-environment.ts')
          if target.exists():
              print('Implementação funcional já consolidada.')
              raise SystemExit(0)

          source_sha = 'b74278c67a8e008952470e283cccc5ee37829564'
          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  f'{source_sha}:.github/workflows/apply-workflow-fixes.yml',
              ],
              text=True,
          )
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          fragile = """if 'server-environment-select' not in template:
    if old_environment not in template:
        raise SystemExit('Linha de ambiente do servidor não encontrada')
    template = template.replace(old_environment, new_environment, 1)"""
          robust = """if 'server-environment-select' not in template:
    icon_marker = '<GlobeAltIcon aria-hidden=\"true\" />'
    icon_index = template.find(icon_marker)
    row_start = template.rfind(
        '            <div class=\"server-config-row\">',
        0,
        icon_index,
    )
    row_end_marker = '            </div>'
    row_end = template.find(row_end_marker, icon_index)
    if icon_index < 0 or row_start < 0 or row_end < 0:
        raise SystemExit('Linha de ambiente do servidor não encontrada')
    row_end += len(row_end_marker)
    template = template[:row_start] + new_environment + template[row_end:]"""
          if fragile not in script:
              raise SystemExit('Trecho frágil do ambiente não encontrado')
          script = script.replace(fragile, robust, 1)

          namespace = {'__name__': '__main__'}
          exec(compile(script, 'apply-workflow-fixes.py', 'exec'), namespace)
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Gerar documentação da API
        run: npm run docs:api

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Consolidar arquivos funcionais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "Nenhum arquivo funcional pendente."
            exit 0
          fi
          git commit -m "fix: corrige commit e ambiente do servidor"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

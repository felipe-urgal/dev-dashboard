name: Task 101 Consolidate

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'agent/task-101-safe-port-inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Aplicar implementação e correções
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          target = Path('packages/contracts/src/port.ts')
          if target.exists():
              print('Implementação funcional já consolidada.')
              raise SystemExit(0)

          source_sha = '252618539c0b540d9920e6018711cf925fa4d9ad'
          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  f'{source_sha}:.github/workflows/task-101-apply.yml',
              ],
              text=True,
          )
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          namespace = {'__name__': '__main__'}
          exec(compile(script, 'task-101-apply.py', 'exec'), namespace)

          service_path = Path(
              'apps/api/src/services/port-inspector-service.ts',
          )
          service = service_path.read_text(encoding='utf-8')

          service, stdout_count = re.subn(
              r"resolve\(\s*typeof stdout === 'string'\s*\? stdout\s*:\s*stdout\.toString\('utf8'\),\s*\);",
              'resolve(stdout);',
              service,
              count=1,
          )

          pid_pattern = (
              r"const parsedPid = processMatch\?\.\[2\]\s*"
              r"\? Number\(processMatch\[2\]\)\s*"
              r": undefined;\s*"
              r"return \{\s*"
              r"\.\.\.endpoint,\s*"
              r"\.\.\.\(Number\.isInteger\(parsedPid\) && parsedPid! > 0\s*"
              r"\? \{ pid: parsedPid \}\s*"
              r": \{\}\),"
          )
          pid_replacement = """const parsedPid = processMatch?.[2]
              ? Number(processMatch[2])
              : undefined;
            const pid =
              parsedPid !== undefined &&
              Number.isInteger(parsedPid) &&
              parsedPid > 0
                ? parsedPid
                : undefined;

            return {
              ...endpoint,
              ...(pid !== undefined ? { pid } : {}),"""
          service, pid_count = re.subn(
              pid_pattern,
              pid_replacement,
              service,
              count=1,
          )

          if stdout_count != 1:
              raise SystemExit('Correção de stdout não aplicada')
          if pid_count != 1:
              raise SystemExit('Correção de PID não aplicada')

          service_path.write_text(service, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Gerar documentação da API
        run: npm run docs:api

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Consolidar arquivos funcionais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "Nenhum arquivo funcional pendente."
            exit 0
          fi
          git commit -m "feat: adiciona inspetor seguro de portas locais"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

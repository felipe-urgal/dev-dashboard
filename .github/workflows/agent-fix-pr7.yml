name: Apply final PR 7 fixes

on:
  push:
    branches:
      - claude/code-review-44gso8

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(content.replace(old, new, 1))

          process_manager = 'packages/process-manager/src/process-manager.ts'

          replace_once(
              process_manager,
              """    const current = previous.catch(() => undefined).then(action);
              this.startLocks.set(
                key,
                current.catch(() => undefined),
              );
              try {
                return await current;
              } finally {
                if (this.startLocks.get(key) === current) {
                  this.startLocks.delete(key);
                }
              }
""",
              """    const current = previous.catch(() => undefined).then(action);
              const tail = current.then(
                () => undefined,
                () => undefined,
              );
              this.startLocks.set(key, tail);
              try {
                return await current;
              } finally {
                if (this.startLocks.get(key) === tail) {
                  this.startLocks.delete(key);
                }
              }
""",
          )

          replace_once(
              process_manager,
              """        const finalStatus: 'stopped' | 'failed' =
                  storedProcess.status === 'stopping'
                    ? 'stopped'
                    : exitCode === 0
                      ? 'stopped'
                      : 'failed';
""",
              """        const finalStatus: 'stopped' | 'failed' =
                  storedProcess.status === 'stopping'
                    ? 'stopped'
                    : kind === 'test' && exitCode === 0
                      ? 'stopped'
                      : 'failed';
""",
          )

          panel = 'apps/web/src/components/ProjectTestsPanel.vue'

          replace_once(
              panel,
              """function formatTimestamp(value: string | undefined): string {
              if (!value) return '—';
              return new Intl.DateTimeFormat('pt-BR', {
                dateStyle: 'short',
                timeStyle: 'medium',
              }).format(new Date(value));
            }

            async function loadOverview(refresh = false): Promise<void> {
              const requestGeneration = ++generation;
""",
              """function formatTimestamp(value: string | undefined): string {
              if (!value) return '—';
              return new Intl.DateTimeFormat('pt-BR', {
                dateStyle: 'short',
                timeStyle: 'medium',
              }).format(new Date(value));
            }

            function isCurrentProjectRequest(
              projectId: string,
              requestGeneration: number,
            ): boolean {
              return (
                props.project.id === projectId &&
                generation === requestGeneration
              );
            }

            async function loadOverview(refresh = false): Promise<void> {
              const projectId = props.project.id;
              const requestGeneration = generation;
""",
          )

          replace_once(
              panel,
              """    const result = await fetchProjectTests(props.project.id, {
                  refresh,
                });
                if (requestGeneration === generation) overview.value = result;
""",
              """    const result = await fetchProjectTests(projectId, {
                  refresh,
                });
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  overview.value = result;
                }
""",
          )

          replace_once(
              panel,
              """    if (requestGeneration === generation) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível carregar os comandos de teste.';
                }
              } finally {
                if (requestGeneration === generation) loadingOverview.value = false;
""",
              """    if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível carregar os comandos de teste.';
                }
              } finally {
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  loadingOverview.value = false;
                }
""",
          )

          replace_once(
              panel,
              """async function refreshProcess(): Promise<boolean> {
              const requestGeneration = generation;
              try {
                const result = await fetchProjectTestProcess(props.project.id);
                if (requestGeneration !== generation) return true;
""",
              """async function refreshProcess(): Promise<boolean> {
              const projectId = props.project.id;
              const requestGeneration = generation;
              try {
                const result = await fetchProjectTestProcess(projectId);
                if (!isCurrentProjectRequest(projectId, requestGeneration)) return true;
""",
          )

          replace_once(
              panel,
              """      const log = await fetchProjectTestLog(props.project.id).catch(
                    () => null,
                  );
                  if (requestGeneration !== generation) return true;
""",
              """      const log = await fetchProjectTestLog(projectId).catch(
                    () => null,
                  );
                  if (!isCurrentProjectRequest(projectId, requestGeneration)) return true;
""",
          )

          replace_once(
              panel,
              """    if (requestGeneration === generation) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível atualizar o processo de testes.';
                }
""",
              """    if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível atualizar o processo de testes.';
                }
""",
          )

          old_handlers = """async function handleStart(commandId: string): Promise<void> {
              startingCommandId.value = commandId;
              errorMessage.value = '';
              try {
                const result = await startProjectTest(props.project.id, commandId);
                managedProcess.value = result;
                logContent.value = '';
                logTruncated.value = false;
                schedulePolling();
              } catch (error) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível iniciar os testes.';
              } finally {
                startingCommandId.value = null;
              }
            }

            async function handleStop(): Promise<void> {
              stopping.value = true;
              errorMessage.value = '';
              try {
                const result = await stopProjectTest(props.project.id);
                managedProcess.value = result;
                await refreshProcess();
              } catch (error) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível interromper os testes.';
              } finally {
                stopping.value = false;
              }
            }

            async function handleClearLogs(): Promise<void> {
              errorMessage.value = '';
              try {
                const log = await clearProjectTestLog(props.project.id);
                logContent.value = log.content;
                logTruncated.value = log.truncated;
              } catch (error) {
                errorMessage.value =
                  error instanceof Error
                    ? error.message
                    : 'Não foi possível limpar o log.';
              }
            }
"""

          new_handlers = """async function handleStart(commandId: string): Promise<void> {
              const projectId = props.project.id;
              const requestGeneration = generation;
              startingCommandId.value = commandId;
              errorMessage.value = '';
              try {
                const result = await startProjectTest(projectId, commandId);
                if (!isCurrentProjectRequest(projectId, requestGeneration)) return;
                managedProcess.value = result;
                logContent.value = '';
                logTruncated.value = false;
                schedulePolling();
              } catch (error) {
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível iniciar os testes.';
                }
              } finally {
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  startingCommandId.value = null;
                }
              }
            }

            async function handleStop(): Promise<void> {
              const projectId = props.project.id;
              const requestGeneration = generation;
              stopping.value = true;
              errorMessage.value = '';
              try {
                const result = await stopProjectTest(projectId);
                if (!isCurrentProjectRequest(projectId, requestGeneration)) return;
                managedProcess.value = result;
                await refreshProcess();
              } catch (error) {
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível interromper os testes.';
                }
              } finally {
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  stopping.value = false;
                }
              }
            }

            async function handleClearLogs(): Promise<void> {
              const projectId = props.project.id;
              const requestGeneration = generation;
              errorMessage.value = '';
              try {
                const log = await clearProjectTestLog(projectId);
                if (!isCurrentProjectRequest(projectId, requestGeneration)) return;
                logContent.value = log.content;
                logTruncated.value = log.truncated;
              } catch (error) {
                if (isCurrentProjectRequest(projectId, requestGeneration)) {
                  errorMessage.value =
                    error instanceof Error
                      ? error.message
                      : 'Não foi possível limpar o log.';
                }
              }
            }
"""
          replace_once(panel, old_handlers, new_handlers)

          replace_once(
              panel,
              """  () => {
                clearPolling();
                overview.value = null;
                managedProcess.value = null;
                logContent.value = '';
                logTruncated.value = false;
                void loadOverview();
                void refreshProcess();
              },
""",
              """  () => {
                generation += 1;
                clearPolling();
                consecutiveFailures = 0;
                overview.value = null;
                managedProcess.value = null;
                logContent.value = '';
                logTruncated.value = false;
                startingCommandId.value = null;
                stopping.value = false;
                errorMessage.value = '';
                void loadOverview();
                void refreshProcess();
              },
""",
          )

          replace_once(
              panel,
              '@click="loadOverview"',
              '@click="loadOverview(true)"',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit validated fixes
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add packages/process-manager/src/process-manager.ts apps/web/src/components/ProjectTestsPanel.vue
          git rm .github/workflows/agent-fix-pr7.yml
          git commit -m "fix: finalize project tests review adjustments"
          git push origin HEAD:claude/code-review-44gso8

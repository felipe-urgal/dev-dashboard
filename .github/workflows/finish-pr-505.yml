name: Finish PR 505

on:
  push:
    branches:
      - feature/vercel-git-managed-deploy
    paths:
      - .github/workflows/finish-pr-505.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native terminal dependency
        run: npm rebuild node-pty

      - name: Regenerate API docs and format
        run: |
          npm run docs:api
          npm run format

      - name: Commit generated changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate API docs and format deployment changes"

      - name: Push generated changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff HEAD^ --quiet 2>/dev/null; then
            echo "Nothing to push."
            exit 0
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

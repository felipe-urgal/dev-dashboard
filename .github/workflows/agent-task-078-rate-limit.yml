name: Agent task 078 rate limit

on:
  push:
    branches:
      - agent/task-078-js-ts-lsp
    paths:
      - .github/workflows/agent-task-078-rate-limit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-078-js-ts-lsp

      - name: Add gateway message rate limit
        run: |
          python <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/services/project-language-server-service.ts')
          content = service.read_text()

          def replace_once(old: str, new: str) -> None:
              global content
              if old not in content:
                  raise SystemExit(f'service pattern not found:\n{old}')
              content = content.replace(old, new, 1)

          replace_once(
              "const MAX_MESSAGE_BYTES = 1024 * 1024;\nconst IDLE_TIMEOUT_MS = 60_000;",
              "const MAX_MESSAGE_BYTES = 1024 * 1024;\nconst MESSAGE_WINDOW_MS = 60_000;\nconst MAX_MESSAGES_PER_WINDOW = 600;\nconst IDLE_TIMEOUT_MS = 60_000;",
          )
          replace_once(
              "  forceKillTimer: NodeJS.Timeout | undefined;\n}",
              "  forceKillTimer: NodeJS.Timeout | undefined;\n  messageWindowStartedAt: number;\n  messagesInWindow: number;\n}",
          )
          replace_once(
              "  idleTimeoutMs?: number;\n  now?: () => number;",
              "  idleTimeoutMs?: number;\n  messageWindowMs?: number;\n  maxMessagesPerWindow?: number;\n  now?: () => number;",
          )
          replace_once(
              "  private readonly idleTimeoutMs: number;\n  private readonly now: () => number;",
              "  private readonly idleTimeoutMs: number;\n  private readonly messageWindowMs: number;\n  private readonly maxMessagesPerWindow: number;\n  private readonly now: () => number;",
          )
          replace_once(
              "    this.idleTimeoutMs = options.idleTimeoutMs ?? IDLE_TIMEOUT_MS;\n    this.now = options.now ?? Date.now;",
              "    this.idleTimeoutMs = options.idleTimeoutMs ?? IDLE_TIMEOUT_MS;\n    this.messageWindowMs = options.messageWindowMs ?? MESSAGE_WINDOW_MS;\n    this.maxMessagesPerWindow =\n      options.maxMessagesPerWindow ?? MAX_MESSAGES_PER_WINDOW;\n    this.now = options.now ?? Date.now;",
          )
          replace_once(
              "    this.clearTimers(session);\n    session.socket = socket;",
              "    this.clearTimers(session);\n    session.messageWindowStartedAt = this.now();\n    session.messagesInWindow = 0;\n    session.socket = socket;",
          )
          replace_once(
              "      idleTimer: undefined,\n      forceKillTimer: undefined,",
              "      idleTimer: undefined,\n      forceKillTimer: undefined,\n      messageWindowStartedAt: now,\n      messagesInWindow: 0,",
          )
          replace_once(
              "  ): void {\n    if (isBinary) {\n      sendProtocolError(socket, undefined, 'Mensagens binárias não são aceitas pelo gateway LSP.');",
              "  ): void {\n    const now = this.now();\n    if (now - session.messageWindowStartedAt >= this.messageWindowMs) {\n      session.messageWindowStartedAt = now;\n      session.messagesInWindow = 0;\n    }\n    session.messagesInWindow += 1;\n    if (session.messagesInWindow > this.maxMessagesPerWindow) {\n      socket.close(1008, 'Limite de mensagens LSP excedido');\n      return;\n    }\n\n    if (isBinary) {\n      sendProtocolError(socket, undefined, 'Mensagens binárias não são aceitas pelo gateway LSP.');",
          )
          service.write_text(content)

          test_file = Path('apps/api/test/project-language-server-service.test.ts')
          tests = test_file.read_text()
          addition = r'''

test('limita a frequência de mensagens por conexão', async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), 'dev-dashboard-lsp-rate-'));
  const child = new FakeChild();
  const service = new ProjectLanguageServerService({
    messageWindowMs: 60_000,
    maxMessagesPerWindow: 1,
    findExecutable: async () => '/usr/bin/typescript-language-server',
    spawnProcess: () => child as unknown as ChildProcessWithoutNullStreams,
  });
  const socket = new FakeSocket();

  try {
    await service.attach(project(root), socket as unknown as WebSocket);
    socket.clientMessage({
      jsonrpc: '2.0',
      id: 1,
      method: 'initialize',
      params: {},
    });
    socket.clientMessage({
      jsonrpc: '2.0',
      method: 'textDocument/didOpen',
      params: {},
    });
    assert.equal(socket.closeCode, 1008);
  } finally {
    service.close();
    await rm(root, { recursive: true, force: true });
  }
});
'''
          if "limita a frequência de mensagens por conexão" not in tests:
              tests += addition
          test_file.write_text(tests)
          PY

      - name: Commit gateway rate limit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/services/project-language-server-service.ts apps/api/test/project-language-server-service.test.ts
          git commit -m "Limita frequência de mensagens do gateway LSP"
          git push origin HEAD:agent/task-078-js-ts-lsp

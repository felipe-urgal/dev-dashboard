name: Finalize AI hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-multi-provider-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format exact files
        run: npx prettier --write apps/api/src/services/ai-implementation-execution-service.ts apps/api/test/ai-assistant-service-provider-neutral.test.ts apps/api/test/ai-implementation-execution-service.test.ts

      - name: Generate API reference
        run: npm run docs:api

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/ai-implementation-execution-service.ts apps/api/test/ai-assistant-service-provider-neutral.test.ts apps/api/test/ai-implementation-execution-service.test.ts docs/architecture/api-reference.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: formata e atualiza referência da API"
          git push origin HEAD:agent/ai-multi-provider-hardening

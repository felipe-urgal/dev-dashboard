          # Documentação curta da decisão.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          marker = """Para Node, procura os scripts na seguinte ordem:\n\n```text\ndev\nstart\nserve\n```"""
          addition = marker + r'''

          Quando existem arquivos `.env.<ambiente>` na raiz de um projeto Node,
          a tela **Servidor** exige a escolha de um ambiente. Antes do start ou
          restart, o arquivo selecionado é copiado de forma atômica para
          `.env.local`, reproduzindo o fluxo do CLI Bash. `.env.local`,
          `.env.sample`, `.env.example` e variantes de template não aparecem
          como opções; valores nunca são devolvidos ao navegador.
          '''
          if 'reproduzindo o fluxo do CLI Bash' not in readme:
              if marker not in readme:
                  raise SystemExit('Seção Node do README não encontrada')
              readme_path.write_text(
                  readme.replace(marker, addition, 1),
                  encoding='utf-8',
              )

          security_path = Path('docs/architecture/security.md')
          security = security_path.read_text(encoding='utf-8')
          if '## Seleção de ambiente do servidor Node' not in security:
              security = security.rstrip() + r'''

          ## Seleção de ambiente do servidor Node

          O catálogo de ambientes considera somente arquivos regulares
          `.env.<identificador>` na raiz do projeto. O identificador usa um
          padrão fechado e arquivos locais ou de exemplo não viram opções.
          Antes do start, a API valida novamente que o item ainda pertence ao
          catálogo e o `ProcessManager` copia o conteúdo para `.env.local` por
          escrita temporária + rename, com limite de 256 KiB e modo `0600`.

          O navegador recebe somente os sufixos dos arquivos. Valores, nomes de
          variáveis e conteúdo não entram no payload. A cópia exige confirmação
          explícita na interface e nenhuma entrada do navegador é usada como
          comando, argumento ou caminho livre.
          '''
              security_path.write_text(security.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Gerar documentação da API
        run: npm run docs:api

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes focados
        run: |
          node --import=tsx --test packages/process-manager/test/server-environment.test.ts
          node --import=tsx --test apps/api/test/server-environment-route.test.ts apps/api/test/git-mutation-routes.test.ts
          npm run test --workspace=@dev-dashboard/web -- --run test/project-server-environment.test.ts

      - name: Suíte completa
        run: npm test

      - name: Consolidar arquivos funcionais
        run: |
          if git diff --quiet -- ':!.github/workflows'; then
            echo 'Correções já aplicadas.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "fix: corrige commit e ambiente do servidor"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

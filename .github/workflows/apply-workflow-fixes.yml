name: Apply Workflow Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/git-commit-tracked-default'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Aplicar correções
        run: |
          python <<'PY'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + '\n', encoding='utf-8')

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if new in content:
                  return
              if old not in content:
                  raise SystemExit(f'Trecho não encontrado em {path}: {old[:100]!r}')
              target.write_text(content.replace(old, new, 1), encoding='utf-8')

          # Contratos compartilhados.
          write('packages/contracts/src/server.ts', r'''
          export interface ProjectServerSettings {
            projectId: string;
            port?: number;
            healthCheckPath?: string;
            environment?: string;
            updatedAt?: string;
          }

          export interface UpdateProjectServerSettingsInput {
            port?: number;
            healthCheckPath?: string;
            environment?: string;
          }

          export interface ProjectServerConfiguration {
            settings: ProjectServerSettings;
            environments: string[];
          }

          export type ServerHealthStatus =
            | 'healthy'
            | 'degraded'
            | 'unavailable';

          export interface ProjectServerHealth {
            projectId: string;
            path: string;
            pathSource: 'configured' | 'detected';
            status: ServerHealthStatus;
            httpStatus?: number;
            latencyMs?: number;
            checkedAt: string;
            message?: string;
          }
          ''')

          replace(
              'packages/contracts/src/index.ts',
              """export type {\n  ProjectServerHealth,\n  ProjectServerSettings,\n  ServerHealthStatus,\n  UpdateProjectServerSettingsInput,\n} from './server.js';""",
              """export type {\n  ProjectServerConfiguration,\n  ProjectServerHealth,\n  ProjectServerSettings,\n  ServerHealthStatus,\n  UpdateProjectServerSettingsInput,\n} from './server.js';""",
          )

          replace(
              'packages/contracts/src/process.ts',
              """  host?: string;\n  url?: string;""",
              """  host?: string;\n  environment?: string;\n  url?: string;""",
          )

          # Catálogo fechado e cópia segura de .env.<ambiente> para .env.local.
          write('packages/process-manager/src/server-environment.ts', r'''
          import { randomBytes } from 'node:crypto';
          import {
            readFile,
            readdir,
            rename,
            rm,
            stat,
            writeFile,
          } from 'node:fs/promises';
          import path from 'node:path';

          import {
            ProjectServerSettingsError,
            validateServerEnvironment,
          } from './server-settings.js';

          const MAX_ENVIRONMENT_FILE_BYTES = 256 * 1_024;
          const TEMPLATE_OR_LOCAL_SUFFIX =
            /(?:^|\.)(?:local|sample|example)$/i;

          function isErrnoException(
            error: unknown,
          ): error is NodeJS.ErrnoException {
            return error instanceof Error && 'code' in error;
          }

          export async function listNodeServerEnvironments(
            projectPath: string,
          ): Promise<string[]> {
            let entries;
            try {
              entries = await readdir(projectPath, {
                withFileTypes: true,
              });
            } catch (error) {
              if (isErrnoException(error) && error.code === 'ENOENT') {
                return [];
              }
              throw error;
            }

            const environments = new Set<string>();
            for (const entry of entries) {
              if (!entry.isFile() || !entry.name.startsWith('.env.')) {
                continue;
              }

              const environment = entry.name.slice('.env.'.length);
              if (
                !environment ||
                TEMPLATE_OR_LOCAL_SUFFIX.test(environment)
              ) {
                continue;
              }

              try {
                validateServerEnvironment(environment);
                environments.add(environment);
              } catch {
                // Arquivo com sufixo inválido não vira opção executável.
              }
            }

            return [...environments].sort((left, right) =>
              left.localeCompare(right),
            );
          }

          export async function prepareNodeServerEnvironment(
            projectPath: string,
            selectedEnvironment?: string,
          ): Promise<string | undefined> {
            if (selectedEnvironment !== undefined) {
              validateServerEnvironment(selectedEnvironment);
            }

            const environments =
              await listNodeServerEnvironments(projectPath);

            if (environments.length === 0) {
              if (selectedEnvironment !== undefined) {
                throw new ProjectServerSettingsError(
                  'SERVER_ENVIRONMENT_NOT_FOUND',
                  `O arquivo .env.${selectedEnvironment} não foi encontrado.`,
                );
              }
              return undefined;
            }

            if (!selectedEnvironment) {
              throw new ProjectServerSettingsError(
                'SERVER_ENVIRONMENT_REQUIRED',
                'Escolha um ambiente antes de iniciar o servidor.',
              );
            }

            if (!environments.includes(selectedEnvironment)) {
              throw new ProjectServerSettingsError(
                'SERVER_ENVIRONMENT_NOT_FOUND',
                `O arquivo .env.${selectedEnvironment} não foi encontrado.`,
              );
            }

            const source = path.join(
              projectPath,
              `.env.${selectedEnvironment}`,
            );
            const target = path.join(projectPath, '.env.local');
            const temporary = path.join(
              projectPath,
              `.env.local.${process.pid}.${randomBytes(6).toString('hex')}.tmp`,
            );

            const sourceStats = await stat(source);
            if (
              !sourceStats.isFile() ||
              sourceStats.size > MAX_ENVIRONMENT_FILE_BYTES
            ) {
              throw new ProjectServerSettingsError(
                'SERVER_ENVIRONMENT_FILE_TOO_LARGE',
                'O arquivo de ambiente excede o limite seguro de 256 KiB.',
              );
            }

            const contents = await readFile(source);
            try {
              await writeFile(temporary, contents, {
                mode: 0o600,
              });
              await rename(temporary, target);
            } catch (error) {
              await rm(temporary, { force: true }).catch(() => undefined);
              throw error;
            }

            return selectedEnvironment;
          }
          ''')

          replace(
              'packages/process-manager/src/index.ts',
              """  ProjectServerSettingsRepository,\n  validateServerPort,\n} from './server-settings.js';""",
              """  ProjectServerSettingsRepository,\n  validateServerEnvironment,\n  validateServerPort,\n} from './server-settings.js';\n\nexport {\n  listNodeServerEnvironments,\n  prepareNodeServerEnvironment,\n} from './server-environment.js';""",
          )

          # Persistência das configurações do servidor.
          settings_path = Path('packages/process-manager/src/server-settings.ts')
          settings = settings_path.read_text(encoding='utf-8')
          settings = settings.replace(
              """  | 'INVALID_SERVER_PORT'\n  | 'INVALID_HEALTH_CHECK_PATH';""",
              """  | 'INVALID_SERVER_PORT'\n  | 'INVALID_HEALTH_CHECK_PATH'\n  | 'INVALID_SERVER_ENVIRONMENT'\n  | 'SERVER_ENVIRONMENT_REQUIRED'\n  | 'SERVER_ENVIRONMENT_NOT_FOUND'\n  | 'SERVER_ENVIRONMENT_FILE_TOO_LARGE';""",
          )
          settings = settings.replace(
              """    (candidate.healthCheckPath !== undefined &&\n      typeof candidate.healthCheckPath !== 'string') ||\n    (candidate.updatedAt !== undefined &&""",
              """    (candidate.healthCheckPath !== undefined &&\n      typeof candidate.healthCheckPath !== 'string') ||\n    (candidate.environment !== undefined &&\n      typeof candidate.environment !== 'string') ||\n    (candidate.updatedAt !== undefined &&""",
          )
          settings = settings.replace(
              """  let healthCheckPath: string | undefined;\n\n  if (candidate.healthCheckPath !== undefined) {""",
              """  let healthCheckPath: string | undefined;\n  let environment: string | undefined;\n\n  if (candidate.healthCheckPath !== undefined) {""",
          )
          settings = settings.replace(
              """  return {\n    projectId: candidate.projectId,""",
              """  if (candidate.environment !== undefined) {\n    try {\n      validateServerEnvironment(candidate.environment);\n      environment = candidate.environment;\n    } catch {\n      // Configuração local inválida não pode virar nome de arquivo.\n    }\n  }\n\n  return {\n    projectId: candidate.projectId,""",
          )
          settings = settings.replace(
              """    ...(healthCheckPath !== undefined\n      ? { healthCheckPath }\n      : {}),\n    ...(candidate.updatedAt !== undefined""",
              """    ...(healthCheckPath !== undefined\n      ? { healthCheckPath }\n      : {}),\n    ...(environment !== undefined\n      ? { environment }\n      : {}),\n    ...(candidate.updatedAt !== undefined""",
          )
          health_marker = """export class ProjectServerSettingsRepository {"""
          environment_validator = r'''
          export function validateServerEnvironment(
            environment: string | undefined,
          ): void {
            if (environment === undefined) return;

            if (
              environment.length > 64 ||
              !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(environment) ||
              /(?:^|\.)(?:local|sample|example)$/i.test(environment)
            ) {
              throw new ProjectServerSettingsError(
                'INVALID_SERVER_ENVIRONMENT',
                'O ambiente selecionado é inválido.',
              );
            }
          }

          '''
          if environment_validator.strip() not in settings:
              settings = settings.replace(
                  health_marker,
                  environment_validator + health_marker,
                  1,
              )
          settings = settings.replace(
              """    validateServerPort(input.port);\n    validateHealthCheckPath(input.healthCheckPath);""",
              """    validateServerPort(input.port);\n    validateHealthCheckPath(input.healthCheckPath);\n    validateServerEnvironment(input.environment);""",
          )
          settings = settings.replace(
              """      ...(input.healthCheckPath !== undefined\n        ? { healthCheckPath: input.healthCheckPath }\n        : {}),\n      updatedAt:""",
              """      ...(input.healthCheckPath !== undefined\n        ? { healthCheckPath: input.healthCheckPath }\n        : {}),\n      ...(input.environment !== undefined\n        ? { environment: input.environment }\n        : {}),\n      updatedAt:""",
          )
          settings_path.write_text(settings, encoding='utf-8')

          # Processo: prepara o arquivo antes do spawn e registra o ambiente.
          replace(
              'packages/process-manager/src/process-lifecycle.ts',
              """import { resolveServerCommand } from './command-resolution.js';\nimport { isErrnoException, ProcessManagerError }""",
              """import { resolveServerCommand } from './command-resolution.js';\nimport { prepareNodeServerEnvironment } from './server-environment.js';\nimport { isErrnoException, ProcessManagerError }""",
          )
          replace(
              'packages/process-manager/src/process-lifecycle.ts',
              """export interface StartServerOptions {\n  port?: number;\n}""",
              """export interface StartServerOptions {\n  port?: number;\n  environment?: string;\n}""",
          )
          replace(
              'packages/process-manager/src/process-lifecycle.ts',
              """    const resolvedCommand = await resolveServerCommand(\n      project,\n      SERVER_BIND_HOST,\n      port,\n    );""",
              """    const environment = project.type === 'node'\n      ? await prepareNodeServerEnvironment(\n          project.path,\n          options.environment,\n        )\n      : project.type === 'rails'\n        ? 'development'\n        : undefined;\n\n    const resolvedCommand = await resolveServerCommand(\n      project,\n      SERVER_BIND_HOST,\n      port,\n    );""",
          )
          replace(
              'packages/process-manager/src/process-lifecycle.ts',
              """      port,\n      url: primaryUrl,""",
              """      port,\n      ...(environment ? { environment } : {}),\n      url: primaryUrl,""",
          )
          replace(
              'packages/process-manager/src/process-state.ts',
              """    isOptionalString(candidate.host) &&\n    isOptionalString(candidate.url) &&""",
              """    isOptionalString(candidate.host) &&\n    isOptionalString(candidate.environment) &&\n    isOptionalString(candidate.url) &&""",
          )

          # Schemas da API.
          replace(
              'apps/api/src/http/response-schemas/processes.ts',
              """    port: { type: 'integer' },\n    url: { type: 'string' },""",
              """    port: { type: 'integer' },\n    environment: { type: 'string', maxLength: 64 },\n    url: { type: 'string' },""",
          )
          replace(
              'apps/api/src/http/response-schemas/processes.ts',
              """    healthCheckPath: { type: 'string' },\n    updatedAt: { type: 'string' },""",
              """    healthCheckPath: { type: 'string' },\n    environment: { type: 'string', maxLength: 64 },\n    updatedAt: { type: 'string' },""",
          )

          replace(
              'apps/api/src/routes/processes/helpers.ts',
              """export interface StartProcessBody {\n  port?: number | null;\n}\n\nexport interface SaveServerSettingsBody {\n  port?: number | null;\n  healthCheckPath?: string | null;\n}""",
              """export interface StartProcessBody {\n  port?: number | null;\n}\n\nexport interface SaveServerSettingsBody {\n  port?: number | null;\n  healthCheckPath?: string | null;\n  environment?: string | null;\n}""",
          )

          write('apps/api/src/routes/processes/server-settings-routes.ts', r'''
          import type { FastifyInstance } from 'fastify';

          import {
            listNodeServerEnvironments,
            ProjectServerSettingsError,
          } from '@dev-dashboard/process-manager';

          import {
            commonErrorResponseSchemas,
            projectServerHealthResponseSchema,
            projectServerSettingsResponseSchema,
          } from '../../http/response-schemas.js';
          import {
            projectParamsSchema,
            requireProject,
            serverSettingsApiError,
            type ProcessRouteOptions,
            type ProjectParams,
            type SaveServerSettingsBody,
          } from './helpers.js';

          const serverSettingsEnvelopeResponseSchema = {
            type: 'object',
            additionalProperties: false,
            required: ['settings', 'environments'],
            properties: {
              settings: projectServerSettingsResponseSchema,
              environments: {
                type: 'array',
                maxItems: 50,
                items: {
                  type: 'string',
                  minLength: 1,
                  maxLength: 64,
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$',
                },
              },
            },
          } as const;

          export function registerServerSettingsRoutes(
            app: FastifyInstance,
            options: ProcessRouteOptions,
          ): void {
            const {
              processManager,
              serverHealthCheckService,
              serverSettingsRepository,
              projectStore,
            } = options;

            async function environmentsForProject(
              project: ReturnType<typeof requireProject>,
            ): Promise<string[]> {
              return project.type === 'node'
                ? await listNodeServerEnvironments(project.path)
                : [];
            }

            app.get<{ Params: ProjectParams }>(
              '/projects/:projectId/server-settings',
              {
                schema: {
                  params: projectParamsSchema,
                  response: {
                    200: serverSettingsEnvelopeResponseSchema,
                    ...commonErrorResponseSchemas,
                  },
                },
              },
              async (request) => {
                const project = requireProject(
                  projectStore,
                  request.params.projectId,
                );
                const [settings, environments] = await Promise.all([
                  serverSettingsRepository.find(project.id),
                  environmentsForProject(project),
                ]);

                return { settings, environments };
              },
            );

            app.put<{
              Params: ProjectParams;
              Body: SaveServerSettingsBody;
            }>(
              '/projects/:projectId/server-settings',
              {
                schema: {
                  params: projectParamsSchema,
                  body: {
                    type: 'object',
                    additionalProperties: false,
                    properties: {
                      port: {
                        anyOf: [
                          { type: 'integer', minimum: 1_024, maximum: 65_535 },
                          { type: 'null' },
                        ],
                      },
                      healthCheckPath: {
                        anyOf: [
                          { type: 'string', minLength: 1, maxLength: 128 },
                          { type: 'null' },
                        ],
                      },
                      environment: {
                        anyOf: [
                          {
                            type: 'string',
                            minLength: 1,
                            maxLength: 64,
                            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$',
                          },
                          { type: 'null' },
                        ],
                      },
                    },
                  },
                  response: {
                    200: serverSettingsEnvelopeResponseSchema,
                    ...commonErrorResponseSchemas,
                  },
                },
              },
              async (request) => {
                const project = requireProject(
                  projectStore,
                  request.params.projectId,
                );

                try {
                  const [current, environments] = await Promise.all([
                    serverSettingsRepository.find(project.id),
                    environmentsForProject(project),
                  ]);
                  const requestedEnvironment = request.body.environment;

                  if (
                    requestedEnvironment !== undefined &&
                    requestedEnvironment !== null &&
                    (
                      project.type !== 'node' ||
                      !environments.includes(requestedEnvironment)
                    )
                  ) {
                    throw new ProjectServerSettingsError(
                      'SERVER_ENVIRONMENT_NOT_FOUND',
                      `O arquivo .env.${requestedEnvironment} não foi encontrado.`,
                    );
                  }

                  const settings = await serverSettingsRepository.save(
                    project.id,
                    {
                      ...(request.body.port === undefined
                        ? current.port !== undefined
                          ? { port: current.port }
                          : {}
                        : request.body.port !== null
                          ? { port: request.body.port }
                          : {}),
                      ...(request.body.healthCheckPath === undefined
                        ? current.healthCheckPath
                          ? { healthCheckPath: current.healthCheckPath }
                          : {}
                        : request.body.healthCheckPath !== null
                          ? { healthCheckPath: request.body.healthCheckPath }
                          : {}),
                      ...(request.body.environment === undefined
                        ? current.environment
                          ? { environment: current.environment }
                          : {}
                        : request.body.environment !== null
                          ? { environment: request.body.environment }
                          : {}),
                    },
                  );

                  return { settings, environments };
                } catch (error) {
                  if (error instanceof ProjectServerSettingsError) {
                    throw serverSettingsApiError(error);
                  }
                  throw error;
                }
              },
            );

            app.get<{ Params: ProjectParams }>(
              '/projects/:projectId/server-health',
              {
                schema: {
                  params: projectParamsSchema,
                  response: {
                    200: {
                      type: 'object',
                      additionalProperties: false,
                      required: ['health'],
                      properties: {
                        health: projectServerHealthResponseSchema,
                      },
                    },
                    ...commonErrorResponseSchemas,
                  },
                },
              },
              async (request) => {
                const project = requireProject(
                  projectStore,
                  request.params.projectId,
                );
                const [process, settings] = await Promise.all([
                  processManager.getServerProcess(project.id),
                  serverSettingsRepository.find(project.id),
                ]);
                const port = process?.port ?? settings.port;

                if (process?.status !== 'running' || port === undefined) {
                  return {
                    health: {
                      projectId: project.id,
                      path: settings.healthCheckPath ?? '/',
                      pathSource: settings.healthCheckPath
                        ? 'configured' as const
                        : 'detected' as const,
                      status: 'unavailable' as const,
                      checkedAt: new Date().toISOString(),
                      message:
                        'O servidor precisa estar em execução para verificar a saúde.',
                    },
                  };
                }

                return {
                  health: await serverHealthCheckService.check({
                    projectId: project.id,
                    port,
                    ...(settings.healthCheckPath
                      ? { healthCheckPath: settings.healthCheckPath }
                      : {}),
                  }),
                };
              },
            );
          }
          ''')

          # Preserva e encaminha o ambiente persistido ao iniciar.
          replace(
              'apps/api/src/routes/processes/server-process-routes.ts',
              """                ...(settings.healthCheckPath\n                  ? {\n                      healthCheckPath:\n                        settings.healthCheckPath,\n                    }\n                  : {}),""",
              """                ...(settings.healthCheckPath\n                  ? {\n                      healthCheckPath:\n                        settings.healthCheckPath,\n                    }\n                  : {}),\n                ...(settings.environment\n                  ? { environment: settings.environment }\n                  : {}),""",
          )
          replace(
              'apps/api/src/routes/processes/server-process-routes.ts',
              """              ...(settings.port !== undefined\n                ? {\n                    port: settings.port,\n                  }\n                : {}),""",
              """              ...(settings.port !== undefined\n                ? {\n                    port: settings.port,\n                  }\n                : {}),\n              ...(settings.environment\n                ? { environment: settings.environment }\n                : {}),""",
          )

          # Novo commit sempre usa o comportamento definido pela interface.
          replace(
              'apps/api/src/routes/git-mutations.ts',
              "gitService.commit(project.path, project.id, request.body.message, request.body.includeAllChanges ?? false, request.body.confirmationToken)",
              "gitService.commit(project.path, project.id, request.body.message, true, request.body.confirmationToken)",
          )

          # Cliente Web mantém compatibilidade e expõe o catálogo de ambientes.
          api_path = Path('apps/web/src/api/processes.ts')
          api = api_path.read_text(encoding='utf-8')
          api = api.replace(
              """  ProcessLogSnapshot,\n  ProjectServerHealth,""",
              """  ProcessLogSnapshot,\n  ProjectServerConfiguration,\n  ProjectServerHealth,""",
          )
          api = api.replace(
              """interface ServerSettingsResponse {\n  settings: ProjectServerSettings;\n}""",
              """interface ServerSettingsResponse extends ProjectServerConfiguration {}""",
          )
          old_fetch = r'''export async function fetchProjectServerSettings(
            projectId: string,
          ): Promise<ProjectServerSettings> {
            const response = await requestJson<ServerSettingsResponse>(
              `/api/projects/${encodeURIComponent(projectId)}/server-settings`,
            );

            return response.settings;
          }'''
          new_fetch = r'''export async function fetchProjectServerConfiguration(
            projectId: string,
          ): Promise<ProjectServerConfiguration> {
            return await requestJson<ServerSettingsResponse>(
              `/api/projects/${encodeURIComponent(projectId)}/server-settings`,
            );
          }

          export async function fetchProjectServerSettings(
            projectId: string,
          ): Promise<ProjectServerSettings> {
            const response = await fetchProjectServerConfiguration(projectId);
            return response.settings;
          }'''
          if 'fetchProjectServerConfiguration' not in api:
              if old_fetch not in api:
                  raise SystemExit('Função fetchProjectServerSettings não encontrada')
              api = api.replace(old_fetch, new_fetch, 1)
          api = api.replace(
              """    port: number | null;\n    healthCheckPath: string | null;\n  },""",
              """    port: number | null;\n    healthCheckPath: string | null;\n    environment: string | null;\n  },""",
              1,
          )
          api_path.write_text(api, encoding='utf-8')

          # Painel do servidor.
          panel_path = Path('apps/web/src/components/ProjectServerPanel.vue')
          panel = panel_path.read_text(encoding='utf-8')
          panel = panel.replace(
              """  fetchProjectServerSettings,\n  openProjectBrowserTarget,""",
              """  fetchProjectServerConfiguration,\n  openProjectBrowserTarget,""",
          )
          panel = panel.replace(
              """import { noticeCenterStore } from '../stores/notice-center';""",
              """import { confirmDialog } from '../stores/app-dialog';\nimport { noticeCenterStore } from '../stores/notice-center';""",
          )
          panel = panel.replace(
              """  commandLabel,\n  environmentLabel,\n  startedAtLabel,""",
              """  commandLabel,\n  startedAtLabel,""",
          )
          panel = panel.replace(
              """const selectedHealthCheckPath = ref('');\nconst loadingSettings""",
              """const selectedHealthCheckPath = ref('');\nconst selectedEnvironment = ref('');\nconst availableEnvironments = ref<string[]>([]);\nconst loadingSettings""",
          )
          insertion = r'''
          const requiresEnvironmentSelection = computed(() =>
            props.project.type === 'node' &&
            availableEnvironments.value.length > 0,
          );

          const environmentSelectionMissing = computed(() =>
            requiresEnvironmentSelection.value &&
            !selectedEnvironment.value,
          );

          const environmentDisplayLabel = computed(() => {
            const runningEnvironment = managedProcess.value?.environment;
            if (props.project.type === 'rails') return 'development';
            const environment = runningEnvironment ?? selectedEnvironment.value;
            return environment
              ? `.env.${environment}`
              : 'Padrão (.env / .env.local)';
          });

          async function confirmEnvironmentReplacement(
            action: 'iniciar' | 'reiniciar',
          ): Promise<boolean> {
            if (
              props.project.type !== 'node' ||
              !selectedEnvironment.value
            ) {
              return true;
            }

            return await confirmDialog({
              title: `Usar .env.${selectedEnvironment.value}?`,
              message:
                `Antes de ${action} o servidor, .env.${selectedEnvironment.value} ` +
                'substituirá .env.local. Nenhum valor será exibido no dashboard.',
              confirmLabel: action === 'iniciar' ? 'Usar e iniciar' : 'Usar e reiniciar',
              tone: 'warning',
            });
          }
          '''
          marker = "const processUrls = computed<string[]>(() => {"
          if 'requiresEnvironmentSelection' not in panel:
              panel = panel.replace(marker, insertion + '\n' + marker, 1)
          panel = panel.replace(
              """    const settings = await fetchProjectServerSettings(projectId);""",
              """    const configuration =\n      await fetchProjectServerConfiguration(projectId);\n    const settings = configuration.settings;""",
          )
          panel = panel.replace(
              """    selectedHealthCheckPath.value =\n      settings.healthCheckPath ?? '';""",
              """    selectedHealthCheckPath.value =\n      settings.healthCheckPath ?? '';\n    availableEnvironments.value = configuration.environments;\n    selectedEnvironment.value =\n      settings.environment &&\n      configuration.environments.includes(settings.environment)\n        ? settings.environment\n        : configuration.environments.length === 1\n          ? configuration.environments[0] ?? ''\n          : '';""",
              1,
          )
          panel = panel.replace(
              """    port,\n    healthCheckPath,\n  });""",

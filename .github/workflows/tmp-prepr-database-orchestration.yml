name: Temporary Pre-PR Database Orchestration

on:
  push:
    branches:
      - refactor/database-orchestration-composables

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/database-orchestration-composables
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native terminal dependency
        run: npm rebuild node-pty
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: API docs check
        run: npm run docs:api:check
      - name: Test
        run: npm test
      - name: CLI Bash
        run: bash tests/cli/run.sh
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-prepr-database-orchestration.yml
          git add -u .github/workflows/tmp-prepr-database-orchestration.yml
          git commit -m "chore(ci): remove validação completa pré-PR"
          git push origin HEAD:refactor/database-orchestration-composables

  e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/database-orchestration-composables
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native terminal dependency
        run: npm rebuild node-pty
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.0
      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: apps/web
      - name: Smoke E2E
        run: npm run test:e2e

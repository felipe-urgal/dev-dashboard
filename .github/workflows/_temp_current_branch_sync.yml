name: Temporary current branch sync implementation

on:
  push:
    branches:
      - agent/task-100-test-failure-navigator

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip-current-branch-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-100-test-failure-navigator
      - name: Apply implementation
        run: python3 .tmp_current_branch_sync.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adiciona atualização segura da branch atual [skip-current-branch-sync]"
          git push origin HEAD:agent/task-100-test-failure-navigator

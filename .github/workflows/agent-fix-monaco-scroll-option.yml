name: Agent fix Monaco scroll option

on:
  push:
    branches:
      - agent/fix-editor-page-scroll
    paths:
      - .github/workflows/agent-fix-monaco-scroll-option.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-editor-page-scroll

      - name: Patch Monaco option
        run: |
          python <<'PY'
          from pathlib import Path

          component = Path('apps/web/src/components/ProjectEmbeddedEditor.vue')
          content = component.read_text()
          old = "      scrollBeyondLastLine: false,\n      alwaysConsumeMouseWheel: false,\n      renderWhitespace: 'selection',"
          new = "      scrollBeyondLastLine: false,\n      scrollbar: { alwaysConsumeMouseWheel: false },\n      renderWhitespace: 'selection',"
          if old not in content:
              raise SystemExit('Monaco option anchor not found')
          component.write_text(content.replace(old, new, 1))

          test = Path('apps/web/test/project-embedded-editor.test.ts')
          test_content = test.read_text()
          old_test = "    monaco.createEditor.mock.calls[0]?.[1]?.alwaysConsumeMouseWheel,"
          new_test = "    monaco.createEditor.mock.calls[0]?.[1]?.scrollbar?.alwaysConsumeMouseWheel,"
          if old_test not in test_content:
              raise SystemExit('Monaco test anchor not found')
          test.write_text(test_content.replace(old_test, new_test, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/ProjectEmbeddedEditor.vue apps/web/test/project-embedded-editor.test.ts
          git commit -m "Corrige opção de scroll do Monaco"
          git push origin HEAD:agent/fix-editor-page-scroll

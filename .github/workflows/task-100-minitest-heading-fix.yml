name: Fix Task 100 Minitest heading

on:
  push:
    branches:
      - agent/task-100-test-failure-navigator

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/task-100-minitest-heading-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: aceita cabeçalhos Minitest numerados ou simples"
          git push

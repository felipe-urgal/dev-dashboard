name: Preparar ambiente
description: Node, dependências, módulos nativos e build dos packages

inputs:
  native-modules:
    description: Módulos nativos a recompilar (node-pty só é necessário para a API e os packages)
    default: esbuild node-pty

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Prepare native dependencies
      shell: bash
      run: npm rebuild ${{ inputs.native-modules }}

    - name: Build packages
      shell: bash
      run: npm run build:packages

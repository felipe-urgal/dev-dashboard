<div class="project-logs-terminal-only">
  <div v-if="isLoading" class="project-log-terminal-empty">
    Carregando terminal do servidor…
  </div>
  <div v-else-if="!hasManagedProcess" class="project-log-terminal-empty">
    Nenhum processo gerenciado foi iniciado para este projeto.
  </div>
  <ProjectLogTerminal
    v-else
    :content="logSnapshot?.content ?? ''"
    :running="processStatus === 'running'"
    :masked-count="logSnapshot?.redactionCount ?? 0"
  />
</div>

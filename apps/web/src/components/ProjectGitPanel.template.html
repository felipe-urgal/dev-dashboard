<section class="git-modern-panel">
  <div class="git-navigation-bar">
    <ProjectGitSubtabs :tabs="tabs" :active-tab="activeTab" @select="openTab" />
  </div>

  <div class="git-modern-messages">
    <div v-if="errorMessage" class="project-error" role="alert">
      {{ errorMessage }}
    </div>
    <div v-if="workspaceErrorMessage" class="project-error" role="alert">
      {{ workspaceErrorMessage }}
    </div>
    <p
      v-if="mutationMessage && activeTab !== 'sync'"
      class="git-mutation-success"
      aria-live="polite"
    >
      {{ mutationMessage }}
    </p>
    <p
      v-if="mutationErrorMessage && activeTab !== 'sync'"
      class="project-error"
      role="alert"
    >
      {{ mutationErrorMessage }}
    </p>
  </div>

  <div v-if="loading && !overview" class="git-modern-empty">
    Consultando o repositório…
  </div>
  <div v-else-if="overview && !overview.repository" class="git-modern-empty">
    <strong>Este projeto não é um repositório Git.</strong>
    <span>Nenhum diretório <code>.git</code> foi encontrado.</span>
  </div>

  <template v-else-if="overview">
    <ProjectGitSyncPage
      v-if="activeTab === 'sync'"
      :overview="overview"
      :workspace="workspace"
      :busy="mutationRunning"
      :checking="remoteRefreshRunning"
      :operation="syncOperation"
      :progress-events="synchronizationProgress"
      :verification-error="remoteRefreshErrorMessage"
      :last-synchronization-at="lastMainSynchronizationAt"
      :synchronization-message="lastMainSynchronizationMessage"
      :synchronization-error="lastMainSynchronizationError"
      @update-current-branch="handleCurrentBranchUpdate"
      @synchronize="handleMainSynchronization"
      @clear-console="clearMainSynchronizationConsole"
    />

    <ProjectGitBranchesPage
      v-else-if="activeTab === 'branches'"
      :overview="overview"
      :workspace="workspace"
      :loading="loadingWorkspace"
      :busy="mutationRunning"
      :remote-refreshing="remoteRefreshRunning"
      :operation="branchOperation"
      @create="(name) => runMutation('create-branch', name)"
      @switch="(name) => runMutation('switch-branch', name)"
      @rename="runRenameBranch"
      @delete="runDeleteBranch"
      @publish="runPublishBranch"
      @track="runTrackRemoteBranch"
      @delete-remote="runDeleteRemoteBranch"
    />

    <ProjectGitDiffPage
      v-else-if="activeTab === 'diff'"
      :project-id="project.id"
    />

    <ProjectGitCommitPage
      v-else-if="activeTab === 'commit'"
      v-model:message="commitMessage"
      v-model:mode="commitMode"
      :overview="overview"
      :busy="mutationRunning"
      :push-branch="pendingPushBranch"
      @submit="runCommit"
      @push="runPublishBranch"
      @open-history="openTab('history')"
    />

    <ProjectGitUndoPage
      v-else-if="activeTab === 'undo'"
      :project-id="project.id"
      :overview="overview"
      :busy="mutationRunning"
      @changed="reloadGitData"
    />

    <ProjectGitPullRequestPage
      v-else-if="activeTab === 'pull-request'"
      :project-id="project.id"
      :overview="overview"
      :workspace="workspace"
      :busy="mutationRunning"
      :force-push-branch="amendedBranch"
      @force-push="runForcePushWithLease"
    />

    <ProjectGitHistoryPage
      v-else-if="activeTab === 'history'"
      :project-id="project.id"
    />
  </template>
</section>

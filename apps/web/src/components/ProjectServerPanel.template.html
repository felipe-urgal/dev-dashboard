<div class="server-dashboard">
  <div v-if="!supportsServer" class="server-empty-state">
    <ServerStackIcon aria-hidden="true" />
    <div>
      <strong>Servidor não disponível</strong>
      <p>Este projeto não possui a capacidade de servidor detectada.</p>
    </div>
  </div>

  <template v-else>
    <section class="server-toolbar" aria-label="Resumo do servidor">
      <div class="server-summary-item server-status-item">
        <span
          class="server-summary-icon server-status-icon"
          :class="`is-${processStatus}`"
        >
          <StopIcon aria-hidden="true" />
        </span>
        <div>
          <span>Status</span>
          <strong class="server-status-label">
            {{ statusLabel }}
            <i :class="`is-${processStatus}`" aria-hidden="true"></i>
          </strong>
        </div>
      </div>

      <div class="server-summary-item">
        <GlobeAltIcon class="server-summary-glyph" aria-hidden="true" />
        <div>
          <span>Porta</span>
          <strong>{{ portDisplayLabel }}</strong>
        </div>
      </div>

      <div class="server-summary-item">
        <CommandLineIcon class="server-summary-glyph" aria-hidden="true" />
        <div>
          <span>Comando</span>
          <strong class="server-summary-code">{{ commandLabel }}</strong>
        </div>
      </div>

      <div class="server-summary-item">
        <ServerStackIcon class="server-summary-glyph" aria-hidden="true" />
        <div>
          <span>Ambiente</span>
          <strong>{{ environmentSummaryLabel }}</strong>
        </div>
      </div>

      <div class="server-toolbar-actions">
        <button
          type="button"
          class="server-secondary-button"
          :disabled="savingSettings || executingAction"
          @click="showSettings = true"
        >
          <Cog6ToothIcon aria-hidden="true" />
          Configurar
        </button>

        <template v-if="canStop">
          <a
            v-if="localAccessUrl"
            class="server-icon-button server-link-button"
            :href="localAccessUrl"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir aplicação"
            title="Abrir aplicação"
          >
            <ArrowTopRightOnSquareIcon aria-hidden="true" />
          </a>
          <button
            v-if="localAccessUrl"
            type="button"
            class="server-icon-button"
            :aria-label="localUrlCopied ? 'URL copiada' : 'Copiar URL local'"
            :title="localUrlCopied ? 'URL copiada' : 'Copiar URL local'"
            @click="copyLocalUrl"
          >
            <ClipboardDocumentIcon aria-hidden="true" />
          </button>
          <button
            type="button"
            class="server-secondary-button"
            :disabled="executingAction"
            @click="handleRestart"
          >
            <ArrowPathIcon aria-hidden="true" />
            {{ currentAction === 'restart' ? 'Reiniciando...' : 'Reiniciar' }}
          </button>
          <button
            type="button"
            class="server-danger-button"
            :disabled="executingAction"
            @click="handleStop"
          >
            <StopIcon aria-hidden="true" />
            {{ currentAction === 'stop' ? 'Parando...' : 'Parar' }}
          </button>
        </template>

        <button
          v-else
          type="button"
          class="server-primary-button"
          :disabled="executingAction || loadingSettings"
          @click="handleStart"
        >
          <PlayIcon aria-hidden="true" />
          {{ currentAction === 'start' ? 'Iniciando...' : 'Iniciar servidor' }}
        </button>
      </div>
    </section>

    <div
      v-if="settingsMessage"
      class="server-feedback server-feedback-success"
      role="status"
    >
      {{ settingsMessage }}
    </div>
    <div
      v-if="errorMessage && !showSettings"
      class="server-feedback server-feedback-error"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <section
      ref="logContainer"
      class="server-console-card"
      aria-label="Console de execução"
    >
      <ProjectLogTerminal
        :content="logSnapshot?.content ?? ''"
        title="Console"
        empty-label="$ aguardando início do servidor..."
        :running="processStatus === 'running'"
        :masked-count="logSnapshot?.redactionCount ?? 0"
        :clearable="hasManagedProcess"
        :clearing="clearingLog"
        @clear="clearLogView"
      />
    </section>

    <div
      v-if="showSettings"
      class="server-settings-backdrop"
      @click.self="showSettings = false"
    >
      <section
        class="server-settings-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="server-settings-title"
      >
        <header class="server-settings-header">
          <div>
            <h2 id="server-settings-title">Configurar servidor</h2>
            <p>Porta, ambiente e comando de execução.</p>
          </div>
          <button
            type="button"
            class="server-icon-button"
            aria-label="Fechar configurações"
            title="Fechar"
            :disabled="savingSettings"
            @click="showSettings = false"
          >
            <XMarkIcon aria-hidden="true" />
          </button>
        </header>

        <div class="server-config-list">
          <label class="server-config-field">
            <span class="server-config-label">
              Porta
              <small title="Use uma porta entre 1024 e 65535.">i</small>
            </span>
            <input
              v-model="selectedPort"
              class="server-config-control server-port-input"
              type="number"
              min="1024"
              max="65535"
              inputmode="numeric"
              placeholder="Automática"
              :disabled="loadingSettings || executingAction"
            />
            <span class="server-config-help">
              Deixe em branco para usar uma porta disponível.
            </span>
          </label>

          <label class="server-config-field">
            <span class="server-config-label">
              Ambiente
              <small
                title="Define o arquivo de ambiente usado somente nesta execução."
              >
                i
              </small>
            </span>
            <select
              v-if="project.type === 'node' && availableEnvironments.length > 0"
              v-model="selectedEnvironment"
              class="server-config-control server-environment-select"
              :disabled="loadingSettings || executingAction"
            >
              <option value="">Padrão (.env / .env.local)</option>
              <option
                v-for="environment in availableEnvironments"
                :key="environment"
                :value="environment"
              >
                {{ `.env.${environment}` }}
              </option>
            </select>
            <span v-else class="server-config-control server-config-readonly">
              {{ environmentDisplayLabel }}
            </span>
            <span class="server-config-help">
              Usa os arquivos .env e .env.local existentes.
            </span>
          </label>

          <div class="server-config-field">
            <span class="server-config-label">
              Comando
              <small title="Comando detectado automaticamente no projeto.">
                i
              </small>
            </span>
            <code class="server-config-control server-config-code">
              {{ commandLabel }}
            </code>
            <span class="server-config-help">
              Comando para iniciar o servidor.
            </span>
          </div>
        </div>

        <div v-if="errorMessage" class="server-modal-error" role="alert">
          {{ errorMessage }}
        </div>

        <footer class="server-settings-footer">
          <button
            type="button"
            class="server-secondary-button"
            :disabled="savingSettings"
            @click="showSettings = false"
          >
            Cancelar
          </button>
          <button
            type="button"
            class="server-primary-button"
            :disabled="savingSettings || loadingSettings || executingAction"
            @click="handleSaveSettings"
          >
            <ClipboardDocumentIcon aria-hidden="true" />
            {{ savingSettings ? 'Salvando...' : 'Salvar configurações' }}
          </button>
        </footer>
      </section>
    </div>
  </template>
</div>

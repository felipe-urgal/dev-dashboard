<div class="server-dashboard">
  <div v-if="!supportsServer" class="server-empty-state">
    <ServerStackIcon aria-hidden="true" />
    <div>
      <strong>Servidor não disponível</strong>
      <p>Este projeto não possui a capacidade de servidor detectada.</p>
    </div>
  </div>

  <template v-else>
    <section class="server-overview" aria-label="Resumo do servidor">
      <article class="server-overview-card">
        <span
          class="server-overview-icon server-overview-status-icon"
          :class="`is-${processStatus}`"
        >
          <StopIcon aria-hidden="true" />
        </span>
        <div class="server-overview-copy">
          <span>Status</span>
          <strong class="server-overview-status">
            {{ statusLabel }}
            <i :class="`is-${processStatus}`" aria-hidden="true"></i>
          </strong>
          <small>{{ statusDescription }}</small>
        </div>
      </article>

      <article class="server-overview-card">
        <span class="server-overview-icon server-overview-port-icon">
          <GlobeAltIcon aria-hidden="true" />
        </span>
        <div class="server-overview-copy">
          <span>Porta</span>
          <strong>{{ portDisplayLabel }}</strong>
          <small>{{ portDescription }}</small>
        </div>
      </article>

      <article class="server-overview-card">
        <span class="server-overview-icon">
          <CommandLineIcon aria-hidden="true" />
        </span>
        <div class="server-overview-copy">
          <span>Comando</span>
          <strong class="server-overview-code">{{ commandLabel }}</strong>
          <small>Comando para iniciar o servidor.</small>
        </div>
      </article>

      <article class="server-overview-card">
        <span class="server-overview-icon">
          <ServerStackIcon aria-hidden="true" />
        </span>
        <div class="server-overview-copy">
          <span>Ambiente</span>
          <strong>{{ environmentSummaryLabel }}</strong>
          <small>Usa arquivos de ambiente do projeto.</small>
        </div>
      </article>
    </section>

    <div class="server-workspace">
      <section class="server-config-card" aria-labelledby="server-config-title">
        <header class="server-section-heading">
          <span class="server-section-icon">
            <ServerStackIcon aria-hidden="true" />
          </span>
          <div>
            <h2 id="server-config-title">Configurar servidor</h2>
            <p>Ajuste as configurações da sua aplicação.</p>
          </div>
        </header>

        <div class="server-config-list">
          <label class="server-config-field">
            <span class="server-config-label">
              Porta
              <small title="Use uma porta entre 1024 e 65535.">i</small>
            </span>
            <input
              v-model="selectedPort"
              class="server-config-control server-port-input"
              type="number"
              min="1024"
              max="65535"
              inputmode="numeric"
              placeholder="Automática"
              :disabled="loadingSettings || executingAction"
            />
            <span class="server-config-help">
              Deixe em branco para usar uma porta disponível.
            </span>
          </label>

          <label class="server-config-field">
            <span class="server-config-label">
              Ambiente
              <small title="Define o arquivo de ambiente usado somente nesta execução.">i</small>
            </span>
            <select
              v-if="project.type === 'node' && availableEnvironments.length > 0"
              v-model="selectedEnvironment"
              class="server-config-control server-environment-select"
              :disabled="loadingSettings || executingAction"
            >
              <option value="">Padrão (.env / .env.local)</option>
              <option
                v-for="environment in availableEnvironments"
                :key="environment"
                :value="environment"
              >
                {{ `.env.${environment}` }}
              </option>
            </select>
            <span v-else class="server-config-control server-config-readonly">
              {{ environmentDisplayLabel }}
            </span>
            <span class="server-config-help">
              Usa os arquivos .env e .env.local existentes.
            </span>
          </label>

          <div class="server-config-field">
            <span class="server-config-label">
              Comando
              <small title="Comando detectado automaticamente no projeto.">i</small>
            </span>
            <code class="server-config-control server-config-code">
              {{ commandLabel }}
            </code>
            <span class="server-config-help">
              Comando para iniciar o servidor.
            </span>
          </div>
        </div>

        <div v-if="settingsMessage" class="server-saved-message" role="status">
          {{ settingsMessage }}
        </div>
        <div v-if="errorMessage && !executingAction" class="server-error" role="alert">
          {{ errorMessage }}
        </div>

        <footer class="server-config-footer">
          <button
            type="button"
            class="server-primary-button server-save-button"
            :disabled="savingSettings || loadingSettings || executingAction"
            @click="handleSaveSettings"
          >
            <ClipboardDocumentIcon aria-hidden="true" />
            {{ savingSettings ? 'Salvando...' : 'Salvar configurações' }}
          </button>
        </footer>
      </section>

      <section class="server-console-card" aria-labelledby="server-console-title">
        <header class="server-section-heading server-console-heading">
          <span class="server-section-icon">
            <CommandLineIcon aria-hidden="true" />
          </span>
          <div>
            <h2 id="server-console-title">Console de execução</h2>
            <p>Execute, acompanhe os logs e monitore o servidor em tempo real.</p>
          </div>
        </header>

        <div
          class="server-console-hero"
          :class="{
            'is-running': processStatus === 'running',
            'is-transitioning': processStatus === 'starting' || processStatus === 'stopping',
            'is-failed': processStatus === 'failed',
          }"
        >
          <span class="server-console-play">
            <BoltIcon v-if="canStop" aria-hidden="true" />
            <PlayIcon v-else aria-hidden="true" />
          </span>
          <div class="server-console-copy">
            <h3>{{ consoleTitle }}</h3>
            <p>{{ consoleDescription }}</p>
          </div>

          <div class="server-console-actions">
            <template v-if="canStop">
              <button
                type="button"
                class="server-danger-button"
                :disabled="executingAction"
                @click="handleStop"
              >
                <StopIcon aria-hidden="true" />
                {{ currentAction === 'stop' ? 'Parando...' : 'Parar servidor' }}
              </button>
              <button
                type="button"
                class="server-secondary-button"
                :disabled="executingAction"
                @click="handleRestart"
              >
                <ArrowPathIcon aria-hidden="true" />
                {{ currentAction === 'restart' ? 'Reiniciando...' : 'Reiniciar' }}
              </button>
              <a
                v-if="primaryProcessUrl"
                class="server-secondary-button server-link-button"
                :href="primaryProcessUrl"
                target="_blank"
                rel="noopener noreferrer"
              >
                <ArrowTopRightOnSquareIcon aria-hidden="true" />
                Abrir no navegador
              </a>
            </template>

            <button
              v-else
              type="button"
              class="server-primary-button server-start-button"
              :disabled="executingAction || loadingSettings"
              @click="handleStart"
            >
              <PlayIcon aria-hidden="true" />
              {{ currentAction === 'start' ? 'Iniciando...' : 'Iniciar servidor' }}
            </button>
          </div>

          <button type="button" class="server-logs-link" @click="focusLogs">
            <ArrowTopRightOnSquareIcon aria-hidden="true" />
            Abrir logs detalhados
          </button>
        </div>

        <div v-if="errorMessage && executingAction" class="server-error server-console-error" role="alert">
          {{ errorMessage }}
        </div>

        <section ref="logContainer" class="server-console-terminal" aria-label="Console de logs">
          <div class="server-console-tabs" aria-label="Visões do console">
            <span class="server-console-tab is-active">
              <CommandLineIcon aria-hidden="true" />
              Logs
            </span>
            <span class="server-console-tab is-disabled" aria-disabled="true">
              Eventos
            </span>
            <span class="server-console-tab is-disabled" aria-disabled="true">
              Saúde
            </span>
            <span
              class="server-terminal-state"
              :class="{ 'is-running': processStatus === 'running' }"
            >
              <i aria-hidden="true"></i>
              {{ processStatus === 'running' ? 'Terminal' : 'Aguardando' }}
            </span>
          </div>

          <ProjectLogTerminal
            :content="logSnapshot?.content ?? ''"
            title="Logs do servidor"
            empty-label="$ aguardando início do servidor..."
            :running="processStatus === 'running'"
            :masked-count="logSnapshot?.redactionCount ?? 0"
            :clearable="hasManagedProcess"
            :clearing="clearingLog"
            @clear="clearLogView"
          />
        </section>
      </section>

      <div class="server-support-grid">
        <section class="server-support-card" aria-labelledby="server-access-title">
          <header class="server-support-heading">
            <span class="server-section-icon">
              <GlobeAltIcon aria-hidden="true" />
            </span>
            <div>
              <h2 id="server-access-title">Acesso local</h2>
              <p>Após iniciar o servidor, acesse sua aplicação em:</p>
            </div>
          </header>

          <div class="server-local-url" :class="{ 'is-empty': !localAccessUrl }">
            <a
              v-if="localAccessUrl"
              :href="localAccessUrl"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ localAccessLabel }}
            </a>
            <span v-else>{{ localAccessLabel }}</span>
            <button
              type="button"
              :disabled="!localAccessUrl"
              :aria-label="localUrlCopied ? 'URL copiada' : 'Copiar URL local'"
              :title="localUrlCopied ? 'URL copiada' : 'Copiar URL local'"
              @click="copyLocalUrl"
            >
              <ClipboardDocumentIcon aria-hidden="true" />
            </button>
          </div>

          <p class="server-support-note">
            <span aria-hidden="true">i</span>
            A porta pode variar se estiver em modo automático.
          </p>
        </section>

        <section class="server-support-card" aria-labelledby="server-checklist-title">
          <header class="server-support-heading">
            <span class="server-section-icon">
              <ServerStackIcon aria-hidden="true" />
            </span>
            <div>
              <h2 id="server-checklist-title">Checklist rápido</h2>
              <p>Verificações para iniciar o servidor.</p>
            </div>
          </header>

          <div class="server-checklist">
            <div class="server-checklist-item">
              <i aria-hidden="true"></i>
              <div>
                <strong>Porta disponível</strong>
                <span>Será verificada ao iniciar.</span>
              </div>
            </div>
            <div class="server-checklist-item">
              <i aria-hidden="true"></i>
              <div>
                <strong>Comando detectado</strong>
                <code>{{ commandLabel }}</code>
              </div>
            </div>
            <div class="server-checklist-item">
              <i aria-hidden="true"></i>
              <div>
                <strong>Ambiente configurado</strong>
                <span>{{ environmentSummaryLabel }}</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </template>
</div>

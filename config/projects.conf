# ============================================================
# CONFIGURAÇÃO DE PROJETOS (projects.conf)
# ============================================================
# Este arquivo permite definir portas fixas para projetos específicos.
# O nome do projeto deve ser o NOME DO DIRETÓRIO (exatamente como está em DEV_BASE).
#
# Formato básico:
#   nome_do_projeto:porta
#
# Exemplos:
fi-ferramentas:3000
fi-editor-api:3001
fi-observatorio-app:3002
fi-editor:3003

# ============================================================
# Formato avançado (ainda não implementado, mas planejado):
#   nome:porta,tipo,webpack,mysql
#
# Exemplo:
#   meu-projeto:4000,rails,no,no
# ============================================================

# Projetos NÃO listados aqui receberão portas automaticamente (a partir de 3000),
# evitando conflitos com as portas configuradas.